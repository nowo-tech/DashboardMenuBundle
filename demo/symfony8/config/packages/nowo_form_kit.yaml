# REQ-DEMO-014: FormKit profile themed with UiKit's semantic classes (no Bootstrap classes).
nowo_form_kit:
    default_profile: default
    profiles:
        default:
            alias: default
            translation_domain: messages
            defaults:
                attr:
                    class: nowo-ui-input
                row_attr:
                    class: nowo-ui-form-row
