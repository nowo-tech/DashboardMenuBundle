# Form: MenuType
form:
  menu_type:
    code:
      label: 'Код'
      help: 'Унікальний ідентифікатор (літери, цифри, _ -). Для базових меню код не можна змінити після створення.'
      placeholder: 'напр. sidebar'
    base:
      label: 'Базове меню'
      help: 'Якщо позначено, код цього меню не можна буде змінити після створення.'
    name:
      label: 'Назва'
      placeholder: 'напр. Бічна панель'
    context:
      label: 'Контекст'
      help: 'Необов’язкові пари ключ-значення в JSON для ідентифікації цього варіанта меню. Під час пошуку за кодом використовується перше відповідне меню з упорядкованих наборів контекстів; порожньо = резервне меню для цього коду.'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'Іконка'
      help: 'Необов’язковий ідентифікатор іконки (напр. Symfony UX Icons: heroicons:home, bootstrap:house).'
      placeholder: 'напр. heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: 'Перевірка дозволів'
      placeholder: '— Дозволити все —'
      allow_all: '— Дозволити все —'
      permission_key_aware: '— За ключем дозволу (структура) —'
      help: 'Сервіс, що реалізує MenuPermissionCheckerInterface (порожньо = дозволити все).'
    depth_limit:
      label: 'Ліміт глибини'
      placeholder: 'порожньо = без обмежень'
      help: 'Максимальна глибина відображення (1 = лише корінь, 2 = корінь + один рівень; порожньо = без обмежень).'
    collapsible:
      label: 'Згортання (обгорнути меню в блок, що перемикається)'
    collapsible_expanded:
      label: 'Згортання розгорнуто (відкрито за замовчуванням)'
    nested_collapsible:
      label: 'Вкладене згортання (пункти з дочірніми мають перемикач)'
    nested_collapsible_sections:
      label: 'Згортання розділів'
      help: 'Потребує вкладеного згортання. Якщо ввімкнено, у рядках розділів праворуч відображається стрілка, а їхні посилання можна згорнути. Якщо вимкнено, дочірні пункти розділів завжди розгорнуті (без стрілки).'
    class_menu:
      label: 'Клас меню (кореневий <ul>)'
      placeholder: 'напр. nav flex-column'
    ul_id:
      label: 'Id ul (кореневий <ul>)'
      placeholder: 'напр. main-menu-navigation'
    class_item:
      label: 'Клас пункту (<li>)'
      placeholder: 'напр. nav-item'
    class_link:
      label: 'Клас посилання (<a>)'
      placeholder: 'напр. nav-link'
    class_children:
      label: 'Клас дочірніх (вкладений <ul>)'
      placeholder: 'напр. nav flex-column ms-2'
    class_section_children:
      label: 'Клас дочірніх розділу (<ul> під itemType "section")'
      placeholder: 'напр. nav flex-column list-unstyled ps-0 (плоский; порожньо = як для дочірніх)'
      help: 'Якщо задано, список першого рівня під кожним розділом використовує ці класи замість «Клас дочірніх», щоб посилання вирівнювалися із заголовком розділу (без відступу). Залиште порожнім, щоб і далі використовувати клас вкладених дочірніх.'
    class_section_child_item:
      label: 'Клас <li> для прямих дочірніх пунктів itemType "section"'
      placeholder: 'напр. nav-item ms-0 (порожньо = як «Клас пункту»)'
      help: 'Якщо задано, посилання та роздільники, що є прямими дочірніми пунктами розділу, використовують це значення як клас <li> замість «Клас пункту». Використовуйте для коригування margin/padding у плоских списках розділів.'
    class_section_child_link:
      label: 'Клас <a> для прямих дочірніх пунктів itemType "section"'
      placeholder: 'напр. d-flex align-items-center ps-0 (порожньо = як «Клас посилання»)'
      help: 'Якщо задано, посилання, що є прямими дочірніми пунктами розділу, використовують це значення як клас <a> замість «Клас посилання». Поєднується з класом <li> дочірніх пунктів розділу для вирівнювання.'
    class_section_label:
      label: 'Клас мітки розділу (itemType "section")'
      placeholder: 'напр. navigation-header'
    class_section:
      label: 'Клас розділу (<li> для itemType "section")'
      placeholder: 'напр. menu-section'
    class_divider:
      label: 'Клас роздільника (<li> для itemType "divider")'
      placeholder: 'напр. menu-divider'
    class_current:
      label: 'Клас поточного (посилання, що відповідає поточному маршруту)'
      placeholder: 'напр. active'
    class_branch_expanded:
      label: 'Клас розгорнутої гілки (<li>, коли маршрут у гілці)'
      placeholder: 'напр. active-branch'
    class_has_children:
      label: 'Клас наявності дочірніх (<li>, коли пункт має дочірні)'
      placeholder: 'напр. has-children'
    class_expanded:
      label: 'Клас розгорнутого (<li>, коли блок дочірніх відкритий)'
      placeholder: 'напр. is-expanded'
    class_collapsed:
      label: 'Клас згорнутого (<li>, коли блок дочірніх закритий)'
      placeholder: 'напр. is-collapsed'
    empty_choice: '— Порожньо —'
    css_section_heading: 'CSS-класи для відображення (якщо задано, перевизначають конфігурацію).'
    section_definition: 'Визначення (код, базове, назва, контекст, іконка)'
    section_config: 'Конфігурація (дозволи, глибина, згортання, CSS)'

  menu_item_type:
    section_basic: 'Ідентифікація (мітки)'
    section_icon: 'Ідентифікація (тип, позиція, іконка)'
    section_config: 'Конфігурація (посилання, дозвіл)'
    label_required: 'Мітка обов’язкова для посилання та розділу.'
    label:
      label: 'Мітка'
    label_locale: 'Мітка (%locale%)'
    divider_label_hint: 'Необов’язкова назва цього роздільника (рекомендовано для доступності та списку на панелі). Залиште порожнім, якщо потрібен лише візуальний роздільник.'
    type:
      label: 'Тип'
      link: 'Посилання'
      section: 'Розділ'
      divider: 'Роздільник'
      service: 'Сервіс (URL під час виконання)'
    link_resolver:
      label: 'Резолвер посилань'
      placeholder: '— Оберіть резолвер —'
      help: 'Оберіть сервіс, що реалізує MenuLinkResolverInterface. Він може повертати одну URL-адресу або список рядків дочірніх посилань (label, href, position); тоді href батьківського пункту дорівнює "#".'
      service_id_placeholder: 'напр. App\Menu\MyLinkResolver'
      help_free_text: 'Введіть id сервісу (ім’я класу або id у контейнері), що реалізує MenuLinkResolverInterface.'
      required: 'Для типу пункту «Сервіс» потрібен резолвер посилань.'
      route_params_hint: 'Необов’язковий JSON, що передається резолверу (наприклад, параметри на кшталт параметрів маршруту).'
    position:
      label: 'Позиція'
    link_type:
      label: 'Тип посилання'
      route: 'Маршрут'
      external_url: 'Зовнішня URL-адреса'
    route_name:
      label: 'Назва маршруту'
      placeholder: '— Оберіть маршрут —'
    route_params:
      label: 'Параметри маршруту (JSON)'
      placeholder: '{}'
    external_url:
      label: 'Зовнішня URL-адреса'
      placeholder: 'https://...'
    target_blank:
      label: 'Відкривати в новій вкладці'
    permission_keys:
      label: 'Ключі дозволів'
      placeholder: '— Дозволити все —'
      help_csv: 'Ключі через кому (використовуються, коли немає налаштованих варіантів).'
      choice:
        authenticated: 'Лише автентифіковані'
        admin: 'Лише адміністратори'
        path__: 'Шлях: / (лише головна)'
    is_unanimous:
      label: 'Вимагати всі вибрані ключі'
      help: 'Увімкнено: мають пройти всі ключі (AND). Вимкнено: достатньо будь-якого ключа (OR).'
    icon:
      label: 'Іконка'
      placeholder: 'heroicons:home'
    parent:
      label: 'Батьківський пункт'
      placeholder: '— Корінь (без батьківського) —'
      help_inheritance: 'Батьківські пункти розташовані над цим у дереві. Ключі дозволів у цьому рядку застосовуються до цього пункту; ваш MenuPermissionChecker визначає, як поєднуються правила батьківських і дочірніх пунктів. Розділи та розгортувані посилання відображаються лише тоді, коли показано принаймні один дочірній пункт.'
      circular_violation: 'Циклічна ієрархія батьківських пунктів не допускається.'
      section_must_be_root: 'Розділи мають залишатися на кореневому рівні (без батьківського пункту).'
    section_collapsible:
      label: 'Згортання дочірніх пунктів розділу'
      inherit: 'Використовувати налаштування меню'
      yes: 'Так (згортається, зі стрілкою)'
      no: 'Ні (завжди розгорнуто)'
      help: 'Перевизначає опцію меню «Згортання розділів» лише для цього розділу. «Використовувати налаштування меню» відповідає конфігурації меню.'

  import_menu_type:
    file:
      label: 'JSON-файл'
      required: 'Будь ласка, оберіть файл.'
      mime_message: 'Файл має бути у форматі JSON.'
    strategy:
      label: 'Коли меню з таким самим кодом і контекстом уже існує'
      skip_existing: 'Пропустити (не імпортувати)'
      replace: 'Замінити (видалити наявні пункти та імпортувати)'

  copy_menu_type:
    code:
      label: 'Код'
      placeholder: 'напр. sidebar_copy'
      regex_message: 'Код може містити лише літери, цифри, підкреслення та дефіс.'
    name:
      label: 'Назва'
      placeholder: 'напр. Бічна панель (копія)'
