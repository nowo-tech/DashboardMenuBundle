# Form: MenuType
form:
  menu_type:
    code:
      label: 'Код'
      help: 'Уникальный идентификатор (буквы, цифры, _ -). Для базовых меню код нельзя изменить после создания.'
      placeholder: 'напр. sidebar'
    base:
      label: 'Базовое меню'
      help: 'Если отмечено, код этого меню нельзя будет изменить после создания.'
    name:
      label: 'Название'
      placeholder: 'напр. Боковая панель'
    context:
      label: 'Контекст'
      help: 'Необязательные пары «ключ-значение» в формате JSON для идентификации этого варианта меню. При выборе по коду используется первое подходящее меню из упорядоченных наборов контекстов; пусто = вариант по умолчанию для этого кода.'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'Иконка'
      help: 'Необязательный идентификатор иконки (напр. Symfony UX Icons: heroicons:home, bootstrap:house).'
      placeholder: 'напр. heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: 'Проверка прав'
      placeholder: '— Разрешить всё —'
      allow_all: '— Разрешить всё —'
      permission_key_aware: '— По ключу прав (структура) —'
      help: 'Сервис, реализующий MenuPermissionCheckerInterface (пусто = разрешить всё).'
    depth_limit:
      label: 'Лимит глубины'
      placeholder: 'пусто = без ограничений'
      help: 'Максимальная глубина вывода (1 = только корень, 2 = корень + один уровень; пусто = без ограничений).'
    collapsible:
      label: 'Сворачиваемое (обернуть меню в переключаемый блок)'
    collapsible_expanded:
      label: 'Сворачиваемое, развёрнуто (открыто по умолчанию)'
    nested_collapsible:
      label: 'Вложенное сворачивание (у пунктов с дочерними есть переключатель)'
    nested_collapsible_sections:
      label: 'Сворачиваемые разделы'
      help: 'Требует включённого вложенного сворачивания. Если включено, строки разделов показывают стрелку справа, а их ссылки можно сворачивать. Если выключено, дочерние пункты раздела всегда развёрнуты (без стрелки).'
    class_menu:
      label: 'Класс меню (корневой <ul>)'
      placeholder: 'напр. nav flex-column'
    ul_id:
      label: 'Id ul (корневой <ul>)'
      placeholder: 'напр. main-menu-navigation'
    class_item:
      label: 'Класс пункта (<li>)'
      placeholder: 'напр. nav-item'
    class_link:
      label: 'Класс ссылки (<a>)'
      placeholder: 'напр. nav-link'
    class_children:
      label: 'Класс дочерних (вложенный <ul>)'
      placeholder: 'напр. nav flex-column ms-2'
    class_section_children:
      label: 'Класс дочерних раздела (<ul> внутри itemType "section")'
      placeholder: 'напр. nav flex-column list-unstyled ps-0 (плоский; пусто = как у дочерних)'
      help: 'Если задано, список первого уровня внутри каждого раздела использует эти классы вместо «Класса дочерних», чтобы ссылки выравнивались по заголовку раздела (без отступа). Оставьте пустым, чтобы использовать класс вложенных дочерних.'
    class_section_child_item:
      label: 'Класс <li> для прямых дочерних itemType "section"'
      placeholder: 'напр. nav-item ms-0 (пусто = как Класс пункта)'
      help: 'Если задано, ссылки и разделители, являющиеся прямыми дочерними элементами раздела, используют этот класс для <li> вместо «Класса пункта». Применяйте для настройки отступов (margin/padding) в плоских списках разделов.'
    class_section_child_link:
      label: 'Класс <a> для прямых дочерних itemType "section"'
      placeholder: 'напр. d-flex align-items-center ps-0 (пусто = как Класс ссылки)'
      help: 'Если задано, ссылки, являющиеся прямыми дочерними элементами раздела, используют этот класс для <a> вместо «Класса ссылки». Используется вместе с классом <li> дочерних раздела для выравнивания.'
    class_section_label:
      label: 'Класс подписи раздела (itemType "section")'
      placeholder: 'напр. navigation-header'
    class_section:
      label: 'Класс раздела (<li> при itemType "section")'
      placeholder: 'напр. menu-section'
    class_divider:
      label: 'Класс разделителя (<li> при itemType "divider")'
      placeholder: 'напр. menu-divider'
    class_current:
      label: 'Класс текущего (ссылка, соответствующая текущему маршруту)'
      placeholder: 'напр. active'
    class_branch_expanded:
      label: 'Класс развёрнутой ветви (<li>, если маршрут в ветви)'
      placeholder: 'напр. active-branch'
    class_has_children:
      label: 'Класс «есть дочерние» (<li>, если у пункта есть дочерние)'
      placeholder: 'напр. has-children'
    class_expanded:
      label: 'Класс развёрнутого (<li>, если блок дочерних открыт)'
      placeholder: 'напр. is-expanded'
    class_collapsed:
      label: 'Класс свёрнутого (<li>, если блок дочерних закрыт)'
      placeholder: 'напр. is-collapsed'
    empty_choice: '— Пусто —'
    css_section_heading: 'CSS-классы для вывода (переопределяют конфигурацию, если заданы).'
    section_definition: 'Определение (код, базовое, название, контекст, иконка)'
    section_config: 'Настройки (права, глубина, сворачивание, CSS)'

  menu_item_type:
    section_basic: 'Идентификация (подписи)'
    section_icon: 'Идентификация (тип, позиция, иконка)'
    section_config: 'Настройки (ссылка, права)'
    label_required: 'Подпись обязательна для ссылки и раздела.'
    label:
      label: 'Подпись'
    label_locale: 'Подпись (%locale%)'
    labels_by_locale: 'Подпись по языкам'
    divider_label_hint: 'Необязательное название разделителя (рекомендуется для доступности и списка в панели). Оставьте пустым, если нужен только визуальный разделитель.'
    type:
      label: 'Тип'
      link: 'Ссылка'
      section: 'Раздел'
      divider: 'Разделитель'
      service: 'Сервис (URL во время выполнения)'
    link_resolver:
      label: 'Резолвер ссылок'
      placeholder: '— Выберите резолвер —'
      help: 'Выберите сервис, реализующий MenuLinkResolverInterface. Он может вернуть один URL или список строк дочерних ссылок (подпись, href, позиция); в этом случае href родителя — "#".'
      service_id_placeholder: 'напр. App\Menu\MyLinkResolver'
      help_free_text: 'Введите id сервиса (имя класса или id в контейнере), реализующего MenuLinkResolverInterface.'
      required: 'Для типа пункта «Сервис» требуется резолвер ссылок.'
      route_params_hint: 'Необязательный JSON, передаваемый резолверу (например, параметры, аналогичные параметрам маршрута).'
    position:
      label: 'Позиция'
    link_type:
      label: 'Тип ссылки'
      route: 'Маршрут'
      external_url: 'Внешний URL'
    route_name:
      label: 'Имя маршрута'
      placeholder: '— Выберите маршрут —'
    route_params:
      label: 'Параметры маршрута (JSON)'
      placeholder: '{}'
    external_url:
      label: 'Внешний URL'
      placeholder: 'https://...'
    target_blank:
      label: 'Открывать в новой вкладке'
    permission_keys:
      label: 'Ключи прав'
      placeholder: '— Разрешить всё —'
      help_csv: 'Ключи через запятую (используются, если нет настроенных вариантов).'
      choice:
        authenticated: 'Только авторизованные'
        admin: 'Только администратор'
        path__: 'Путь: / (только главная)'
    is_unanimous:
      label: 'Требовать все выбранные ключи'
      help: 'Включено: должны выполняться все ключи (AND). Выключено: достаточно любого ключа (OR).'
    icon:
      label: 'Иконка'
      placeholder: 'heroicons:home'
    parent:
      label: 'Родитель'
      placeholder: '— Корень (без родителя) —'
      help_inheritance: 'Родительские пункты находятся в дереве выше этого. Ключи прав в этой строке применяются к данному пункту; как сочетаются правила родителя и дочерних пунктов, решает ваш MenuPermissionChecker. Разделы и раскрывающиеся ссылки выводятся, только если показан хотя бы один дочерний пункт.'
      circular_violation: 'Циклическая иерархия родителей недопустима.'
      section_must_be_root: 'Разделы должны оставаться на корневом уровне (без родителя).'
    section_collapsible:
      label: 'Сворачиваемые дочерние пункты раздела'
      inherit: 'По умолчанию для меню'
      yes: 'Да (сворачиваемые со стрелкой)'
      no: 'Нет (всегда развёрнуты)'
      help: 'Переопределяет параметр меню «Сворачиваемые разделы» только для этого раздела. «По умолчанию для меню» — следовать настройкам меню.'

  import_menu_type:
    file:
      label: 'JSON-файл'
      required: 'Выберите файл.'
      mime_message: 'Файл должен быть в формате JSON.'
    strategy:
      label: 'Если меню с тем же кодом и контекстом уже существует'
      skip_existing: 'Пропустить (не импортировать)'
      replace: 'Заменить (удалить существующие пункты и импортировать)'

  copy_menu_type:
    code:
      label: 'Код'
      placeholder: 'напр. sidebar_copy'
      regex_message: 'Код может содержать только буквы, цифры, подчёркивание и дефис.'
    name:
      label: 'Название'
      placeholder: 'напр. Боковая панель (копия)'
