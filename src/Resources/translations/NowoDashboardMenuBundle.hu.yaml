# Form: MenuType
form:
  menu_type:
    code:
      label: 'Kód'
      help: 'Egyedi azonosító (betűk, számok, _ -). Alapmenük esetén a kód a létrehozás után nem módosítható.'
      placeholder: 'pl. sidebar'
    base:
      label: 'Alapmenü'
      help: 'Ha be van jelölve, a menü kódja a létrehozás után nem módosítható.'
    name:
      label: 'Név'
      placeholder: 'pl. Oldalsáv'
    context:
      label: 'Környezet'
      help: 'Opcionális JSON kulcs-érték párok a menüváltozat azonosításához. Kód alapján történő feloldáskor a rendezett környezeti halmazok közül az első egyező menü kerül felhasználásra; üres = tartalék az adott kódhoz.'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'Ikon'
      help: 'Opcionális ikonazonosító (pl. Symfony UX Icons: heroicons:home, bootstrap:house).'
      placeholder: 'pl. heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: 'Jogosultság-ellenőrző'
      placeholder: '— Minden engedélyezése —'
      allow_all: '— Minden engedélyezése —'
      permission_key_aware: '— Jogosultságkulcs alapján (struktúra) —'
      help: 'A MenuPermissionCheckerInterface interfészt megvalósító szolgáltatás (üres = minden engedélyezése).'
    depth_limit:
      label: 'Mélységkorlát'
      placeholder: 'üres = korlátlan'
      help: 'Megjelenítendő maximális mélység (1 = csak gyökér, 2 = gyökér + egy szint; üres = korlátlan).'
    collapsible:
      label: 'Összecsukható (a menü lenyitható blokkba kerül)'
    collapsible_expanded:
      label: 'Összecsukható, kibontva (alapértelmezetten nyitva)'
    nested_collapsible:
      label: 'Beágyazott összecsukható (a gyermekelemmel rendelkező elemek lenyithatók)'
    nested_collapsible_sections:
      label: 'Összecsukható szakaszok'
      help: 'Beágyazott összecsukhatóságot igényel. Bekapcsolva a szakaszsorok jobb oldalán nyíl jelenik meg, és a hivatkozásaik összecsukhatók. Kikapcsolva a szakaszok gyermekelemei mindig kibontva maradnak (nyíl nélkül).'
    class_menu:
      label: 'Menü osztálya (gyökér <ul>)'
      placeholder: 'pl. nav flex-column'
    ul_id:
      label: 'Ul azonosító (gyökér <ul>)'
      placeholder: 'pl. main-menu-navigation'
    class_item:
      label: 'Elem osztálya (<li>)'
      placeholder: 'pl. nav-item'
    class_link:
      label: 'Hivatkozás osztálya (<a>)'
      placeholder: 'pl. nav-link'
    class_children:
      label: 'Gyermekelemek osztálya (beágyazott <ul>)'
      placeholder: 'pl. nav flex-column ms-2'
    class_section_children:
      label: 'Szakasz gyermekelemeinek osztálya (<ul> az itemType "section" alatt)'
      placeholder: 'pl. nav flex-column list-unstyled ps-0 (lapos; üres = ugyanaz, mint a gyermekelemeknél)'
      help: 'Ha meg van adva, az egyes szakaszok alatti első szintű lista ezeket az osztályokat használja a „Gyermekelemek osztálya” helyett, így a hivatkozások a szakasz címéhez igazodhatnak (behúzás nélkül). Hagyja üresen, ha továbbra is a beágyazott gyermekelemek osztályát szeretné használni.'
    class_section_child_item:
      label: '<li> osztály az itemType "section" közvetlen gyermekelemeihez'
      placeholder: 'pl. nav-item ms-0 (üres = ugyanaz, mint az Elem osztálya)'
      help: 'Ha meg van adva, a szakasz közvetlen gyermekelemeiként szereplő hivatkozások és elválasztók ezt használják <li> osztályként az „Elem osztálya” helyett. Lapos szakaszlisták margó- és kitöltésfinomítására használható.'
    class_section_child_link:
      label: '<a> osztály az itemType "section" közvetlen gyermekelemeihez'
      placeholder: 'pl. d-flex align-items-center ps-0 (üres = ugyanaz, mint a Hivatkozás osztálya)'
      help: 'Ha meg van adva, a szakasz közvetlen gyermekelemeiként szereplő hivatkozások ezt használják <a> osztályként a „Hivatkozás osztálya” helyett. Az igazításhoz a szakasz gyermekelemének <li> osztályával együtt használható.'
    class_section_label:
      label: 'Szakaszfelirat osztálya (itemType "section")'
      placeholder: 'pl. navigation-header'
    class_section:
      label: 'Szakasz osztálya (<li>, ha itemType "section")'
      placeholder: 'pl. menu-section'
    class_divider:
      label: 'Elválasztó osztálya (<li>, ha itemType "divider")'
      placeholder: 'pl. menu-divider'
    class_current:
      label: 'Aktuális elem osztálya (az aktuális útvonalnak megfelelő hivatkozás)'
      placeholder: 'pl. active'
    class_branch_expanded:
      label: 'Kibontott ág osztálya (<li>, ha az útvonal az ágban van)'
      placeholder: 'pl. active-branch'
    class_has_children:
      label: 'Gyermekelemes osztály (<li>, ha az elemnek vannak gyermekelemei)'
      placeholder: 'pl. has-children'
    class_expanded:
      label: 'Kibontott osztály (<li>, ha a gyermekblokk nyitva van)'
      placeholder: 'pl. is-expanded'
    class_collapsed:
      label: 'Összecsukott osztály (<li>, ha a gyermekblokk zárva van)'
      placeholder: 'pl. is-collapsed'
    empty_choice: '— Üres —'
    css_section_heading: 'CSS-osztályok a megjelenítéshez (megadás esetén felülírják a konfigurációt).'
    section_definition: 'Meghatározás (kód, alap, név, környezet, ikon)'
    section_config: 'Beállítások (jogosultságok, mélység, összecsukhatóság, CSS)'

  menu_item_type:
    section_basic: 'Azonosítás (feliratok)'
    section_icon: 'Azonosítás (típus, pozíció, ikon)'
    section_config: 'Beállítások (hivatkozás, jogosultság)'
    label_required: 'Hivatkozás és Szakasz esetén a felirat megadása kötelező.'
    label:
      label: 'Felirat'
    label_locale: 'Felirat (%locale%)'
    labels_by_locale: 'Felirat nyelvenként'
    divider_label_hint: 'Opcionális név ehhez az elválasztóhoz (az akadálymentesség és a kezelőfelület listája miatt ajánlott). Hagyja üresen, ha csak vizuális elválasztóra van szükség.'
    type:
      label: 'Típus'
      link: 'Hivatkozás'
      section: 'Szakasz'
      divider: 'Elválasztó'
      service: 'Szolgáltatás (futásidejű URL)'
    link_resolver:
      label: 'Hivatkozásfeloldó'
      placeholder: '— Válasszon feloldót —'
      help: 'Válasszon egy szolgáltatást, amely megvalósítja a MenuLinkResolverInterface interfészt. Visszaadhat egyetlen URL-t vagy gyermekhivatkozás-sorok listáját (label, href, position); ekkor a szülő href értéke "#".'
      service_id_placeholder: 'pl. App\Menu\MyLinkResolver'
      help_free_text: 'Adja meg a MenuLinkResolverInterface interfészt megvalósító szolgáltatás azonosítóját (osztálynév vagy konténerazonosító).'
      required: 'A „Szolgáltatás” elemtípushoz hivatkozásfeloldó szükséges.'
      route_params_hint: 'A feloldónak átadott opcionális JSON (például útvonalszerű paraméterek).'
    position:
      label: 'Pozíció'
    link_type:
      label: 'Hivatkozás típusa'
      route: 'Útvonal'
      external_url: 'Külső URL'
    route_name:
      label: 'Útvonal neve'
      placeholder: '— Válasszon útvonalat —'
    route_params:
      label: 'Útvonal paraméterei (JSON)'
      placeholder: '{}'
    external_url:
      label: 'Külső URL'
      placeholder: 'https://...'
    target_blank:
      label: 'Megnyitás új lapon'
    permission_keys:
      label: 'Jogosultságkulcsok'
      placeholder: '— Minden engedélyezése —'
      help_csv: 'Vesszővel elválasztott kulcsok (akkor használatos, ha nincsenek beállított választási lehetőségek).'
      choice:
        authenticated: 'Csak bejelentkezett felhasználók'
        admin: 'Csak adminisztrátorok'
        path__: 'Útvonal: / (csak kezdőlap)'
    is_unanimous:
      label: 'Az összes kiválasztott kulcs megkövetelése'
      help: 'Bekapcsolva: minden kulcsnak teljesülnie kell (AND). Kikapcsolva: bármelyik kulcs elegendő (OR).'
    icon:
      label: 'Ikon'
      placeholder: 'heroicons:home'
    parent:
      label: 'Szülő'
      placeholder: '— Gyökér (nincs szülő) —'
      help_inheritance: 'A szülőelemek a fában ezen elem felett helyezkednek el. Az ebben a sorban megadott jogosultságkulcsok erre az elemre vonatkoznak; a MenuPermissionChecker megvalósítása dönti el, hogyan kombinálódnak a szülő- és gyermekszabályok. A szakaszok és a kibontható hivatkozások csak akkor jelennek meg, ha legalább egy gyermekelem látható.'
      circular_violation: 'Körkörös szülőhierarchia nem engedélyezett.'
      section_must_be_root: 'A szakaszelemeknek gyökérszinten kell maradniuk (szülő nélkül).'
    section_collapsible:
      label: 'A szakasz gyermekelemei összecsukhatók'
      inherit: 'A menü alapértelmezésének használata'
      yes: 'Igen (összecsukható nyíllal)'
      no: 'Nem (mindig kibontva)'
      help: 'Csak ennél a szakasznál felülírja a menü „Összecsukható szakaszok” beállítását. „A menü alapértelmezésének használata” a menü konfigurációját követi.'

  import_menu_type:
    file:
      label: 'JSON-fájl'
      required: 'Kérjük, válasszon egy fájlt.'
      mime_message: 'A fájlnak JSON formátumúnak kell lennie.'
    strategy:
      label: 'Ha már létezik menü azonos kóddal és környezettel'
      skip_existing: 'Kihagyás (nincs importálás)'
      replace: 'Csere (a meglévő elemek törlése és importálás)'

  copy_menu_type:
    code:
      label: 'Kód'
      placeholder: 'pl. sidebar_copy'
      regex_message: 'A kód csak betűket, számokat, aláhúzásjelet és kötőjelet tartalmazhat.'
    name:
      label: 'Név'
      placeholder: 'pl. Oldalsáv (másolat)'
