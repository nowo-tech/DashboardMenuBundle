# Form: MenuType
form:
  menu_type:
    code:
      label: 'Kode'
      help: 'Unik identifikator (bokstaver, tall, _ -). For grunnmenyer kan koden ikke endres etter opprettelse.'
      placeholder: 'f.eks. sidebar'
    base:
      label: 'Grunnmeny'
      help: 'Når dette er avkrysset, kan ikke menyens kode endres etter opprettelse.'
    name:
      label: 'Navn'
      placeholder: 'f.eks. Sidepanel'
    context:
      label: 'Kontekst'
      help: 'Valgfrie JSON-nøkkel/verdi-par som identifiserer denne menyvarianten. Ved oppslag etter kode brukes den første samsvarende menyen i de ordnede kontekstsettene; tom = reserve for den koden.'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'Ikon'
      help: 'Valgfri ikonidentifikator (f.eks. Symfony UX Icons: heroicons:home, bootstrap:house).'
      placeholder: 'f.eks. heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: 'Tillatelseskontroll'
      placeholder: '— Tillat alle —'
      allow_all: '— Tillat alle —'
      permission_key_aware: '— Etter tillatelsesnøkkel (struktur) —'
      help: 'Tjeneste som implementerer MenuPermissionCheckerInterface (tom = tillat alle).'
    depth_limit:
      label: 'Dybdegrense'
      placeholder: 'tom = ubegrenset'
      help: 'Maksimal dybde som gjengis (1 = bare rot, 2 = rot + ett nivå; tom = ubegrenset).'
    collapsible:
      label: 'Sammenleggbar (pakk menyen inn i en vekslingsblokk)'
    collapsible_expanded:
      label: 'Sammenleggbar utvidet (åpen som standard)'
    nested_collapsible:
      label: 'Nestet sammenleggbar (elementer med underelementer får en veksler)'
    nested_collapsible_sections:
      label: 'Sammenleggbare seksjoner'
      help: 'Krever nestet sammenleggbar. Når aktivert, viser seksjonsrader en vinkelpil til høyre, og lenkene kan felles sammen. Når deaktivert, er underelementene i seksjonen alltid utvidet (ingen vinkelpil).'
    class_menu:
      label: 'Menyklasse (rot-<ul>)'
      placeholder: 'f.eks. nav flex-column'
    ul_id:
      label: 'Ul-id (rot-<ul>)'
      placeholder: 'f.eks. main-menu-navigation'
    class_item:
      label: 'Elementklasse (<li>)'
      placeholder: 'f.eks. nav-item'
    class_link:
      label: 'Lenkeklasse (<a>)'
      placeholder: 'f.eks. nav-link'
    class_children:
      label: 'Underelementklasse (nestet <ul>)'
      placeholder: 'f.eks. nav flex-column ms-2'
    class_section_children:
      label: 'Klasse for seksjonens underelementer (<ul> under itemType "section")'
      placeholder: 'f.eks. nav flex-column list-unstyled ps-0 (flat; tom = samme som underelementer)'
      help: 'Når den er angitt, bruker listen på første nivå under hver seksjon disse klassene i stedet for «Underelementklasse», slik at lenkene kan justeres etter seksjonstittelen (uten innrykk). La stå tom for å fortsette å bruke klassen for nestede underelementer.'
    class_section_child_item:
      label: '<li>-klasse for direkte underelementer av itemType "section"'
      placeholder: 'f.eks. nav-item ms-0 (tom = samme som Elementklasse)'
      help: 'Når den er angitt, bruker lenker og skillelinjer som er direkte underelementer av en seksjon denne verdien som <li>-klasse i stedet for «Elementklasse». Bruk den til å justere marg/utfylling under flate seksjonslister.'
    class_section_child_link:
      label: '<a>-klasse for direkte underelementer av itemType "section"'
      placeholder: 'f.eks. d-flex align-items-center ps-0 (tom = samme som Lenkeklasse)'
      help: 'Når den er angitt, bruker lenker som er direkte underelementer av en seksjon denne verdien som <a>-klasse i stedet for «Lenkeklasse». Brukes sammen med seksjonens underelement-<li> for justering.'
    class_section_label:
      label: 'Klasse for seksjonsetikett (itemType "section")'
      placeholder: 'f.eks. navigation-header'
    class_section:
      label: 'Seksjonsklasse (<li> når itemType er "section")'
      placeholder: 'f.eks. menu-section'
    class_divider:
      label: 'Skilleklasse (<li> når itemType er "divider")'
      placeholder: 'f.eks. menu-divider'
    class_current:
      label: 'Klasse for gjeldende (lenke som samsvarer med gjeldende rute)'
      placeholder: 'f.eks. active'
    class_branch_expanded:
      label: 'Klasse for utvidet gren (<li> når ruten er i grenen)'
      placeholder: 'f.eks. active-branch'
    class_has_children:
      label: 'Klasse for har underelementer (<li> når elementet har underelementer)'
      placeholder: 'f.eks. has-children'
    class_expanded:
      label: 'Klasse for utvidet (<li> når underelementblokken er åpen)'
      placeholder: 'f.eks. is-expanded'
    class_collapsed:
      label: 'Klasse for sammenlagt (<li> når underelementblokken er lukket)'
      placeholder: 'f.eks. is-collapsed'
    empty_choice: '— Tom —'
    css_section_heading: 'CSS-klasser for gjengivelse (overstyrer konfigurasjonen når de er angitt).'
    section_definition: 'Definisjon (kode, grunnmeny, navn, kontekst, ikon)'
    section_config: 'Konfigurasjon (tillatelser, dybde, sammenleggbar, CSS)'

  menu_item_type:
    section_basic: 'Identitet (etiketter)'
    section_icon: 'Identitet (type, posisjon, ikon)'
    section_config: 'Konfigurasjon (lenke, tillatelse)'
    label_required: 'Etikett er påkrevd for Lenke og Seksjon.'
    label:
      label: 'Etikett'
    label_locale: 'Etikett (%locale%)'
    divider_label_hint: 'Valgfritt navn for denne skillelinjen (anbefales for tilgjengelighet og dashbordlisten). La stå tomt hvis du bare trenger en visuell skillelinje.'
    type:
      label: 'Type'
      link: 'Lenke'
      section: 'Seksjon'
      divider: 'Skillelinje'
      service: 'Tjeneste (URL ved kjøretid)'
    link_resolver:
      label: 'Lenkeresolver'
      placeholder: '— Velg resolver —'
      help: 'Velg en tjeneste som implementerer MenuLinkResolverInterface. Den kan returnere én URL eller en liste med underlenkerader (etikett, href, posisjon); den overordnede href-en blir da "#".'
      service_id_placeholder: 'f.eks. App\Menu\MyLinkResolver'
      help_free_text: 'Skriv inn tjeneste-id-en (klassenavn eller container-id) som implementerer MenuLinkResolverInterface.'
      required: 'En lenkeresolver er påkrevd for elementtypen «Tjeneste».'
      route_params_hint: 'Valgfri JSON som sendes til resolveren (for eksempel rutelignende parametere).'
    position:
      label: 'Posisjon'
    link_type:
      label: 'Lenketype'
      route: 'Rute'
      external_url: 'Ekstern URL'
    route_name:
      label: 'Rutenavn'
      placeholder: '— Velg rute —'
    route_params:
      label: 'Ruteparametere (JSON)'
      placeholder: '{}'
    external_url:
      label: 'Ekstern URL'
      placeholder: 'https://...'
    target_blank:
      label: 'Åpne i ny fane'
    permission_keys:
      label: 'Tillatelsesnøkler'
      placeholder: '— Tillat alle —'
      help_csv: 'Kommaseparerte nøkler (brukes når ingen konfigurerte valg er tilgjengelige).'
      choice:
        authenticated: 'Bare autentiserte'
        admin: 'Bare administratorer'
        path__: 'Sti: / (bare startsiden)'
    is_unanimous:
      label: 'Krev alle valgte nøkler'
      help: 'Aktivert: alle nøkler må godkjennes (AND). Deaktivert: det holder at én nøkkel godkjennes (OR).'
    icon:
      label: 'Ikon'
      placeholder: 'heroicons:home'
    parent:
      label: 'Overordnet'
      placeholder: '— Rot (ingen overordnet) —'
      help_inheritance: 'Overordnede elementer ligger over dette i treet. Tillatelsesnøkler på denne raden gjelder for dette elementet; din MenuPermissionChecker avgjør hvordan regler for overordnede og underordnede kombineres. Seksjoner og utvidbare lenker gjengis bare når minst ett underelement vises.'
      circular_violation: 'Sirkulært overordnet hierarki er ikke tillatt.'
      section_must_be_root: 'Seksjonselementer må ligge på rotnivå (ingen overordnet).'
    section_collapsible:
      label: 'Seksjonens underelementer sammenleggbare'
      inherit: 'Bruk menyens standard'
      yes: 'Ja (sammenleggbar med vinkelpil)'
      no: 'Nei (alltid utvidet)'
      help: 'Overstyrer menyalternativet «Sammenleggbare seksjoner» bare for denne seksjonen. «Bruk menyens standard» følger menykonfigurasjonen.'

  import_menu_type:
    file:
      label: 'JSON-fil'
      required: 'Velg en fil.'
      mime_message: 'Filen må være JSON.'
    strategy:
      label: 'Når en meny med samme kode og kontekst allerede finnes'
      skip_existing: 'Hopp over (ikke importer)'
      replace: 'Erstatt (slett eksisterende elementer og importer)'

  copy_menu_type:
    code:
      label: 'Kode'
      placeholder: 'f.eks. sidebar_copy'
      regex_message: 'Koden kan bare inneholde bokstaver, tall, understrek og bindestrek.'
    name:
      label: 'Navn'
      placeholder: 'f.eks. Sidepanel (kopi)'
