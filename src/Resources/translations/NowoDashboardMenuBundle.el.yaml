# Form: MenuType
form:
  menu_type:
    code:
      label: 'Κωδικός'
      help: 'Μοναδικό αναγνωριστικό (γράμματα, αριθμοί, _ -). Για τα βασικά μενού, ο κωδικός δεν μπορεί να αλλάξει μετά τη δημιουργία.'
      placeholder: 'π.χ. sidebar'
    base:
      label: 'Βασικό μενού'
      help: 'Όταν είναι επιλεγμένο, ο κωδικός αυτού του μενού δεν μπορεί να αλλάξει μετά τη δημιουργία.'
    name:
      label: 'Όνομα'
      placeholder: 'π.χ. Πλευρική στήλη'
    context:
      label: 'Πλαίσιο'
      help: 'Προαιρετικά ζεύγη κλειδιού-τιμής JSON για την αναγνώριση αυτής της παραλλαγής μενού. Κατά την επίλυση με βάση τον κωδικό, χρησιμοποιείται το πρώτο μενού που ταιριάζει στα ταξινομημένα σύνολα πλαισίου· κενό = εναλλακτική επιλογή για αυτόν τον κωδικό.'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'Εικονίδιο'
      help: 'Προαιρετικό αναγνωριστικό εικονιδίου (π.χ. Symfony UX Icons: heroicons:home, bootstrap:house).'
      placeholder: 'π.χ. heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: 'Έλεγχος δικαιωμάτων'
      placeholder: '— Να επιτρέπονται όλα —'
      allow_all: '— Να επιτρέπονται όλα —'
      permission_key_aware: '— Βάσει κλειδιού δικαιώματος (δομή) —'
      help: 'Υπηρεσία που υλοποιεί το MenuPermissionCheckerInterface (κενό = να επιτρέπονται όλα).'
    depth_limit:
      label: 'Όριο βάθους'
      placeholder: 'κενό = απεριόριστο'
      help: 'Μέγιστο βάθος απόδοσης (1 = μόνο ρίζα, 2 = ρίζα + ένα επίπεδο· κενό = απεριόριστο).'
    collapsible:
      label: 'Πτυσσόμενο (περικλείει το μενού σε μπλοκ εναλλαγής)'
    collapsible_expanded:
      label: 'Πτυσσόμενο αναπτυγμένο (ανοιχτό από προεπιλογή)'
    nested_collapsible:
      label: 'Ένθετο πτυσσόμενο (τα στοιχεία με θυγατρικά έχουν εναλλαγή)'
    nested_collapsible_sections:
      label: 'Πτυσσόμενες ενότητες'
      help: 'Απαιτεί ένθετο πτυσσόμενο. Όταν είναι ενεργοποιημένο, οι γραμμές ενοτήτων εμφανίζουν ένα βέλος στα δεξιά και οι σύνδεσμοί τους μπορούν να συμπτυχθούν. Όταν είναι απενεργοποιημένο, τα θυγατρικά των ενοτήτων παραμένουν πάντα αναπτυγμένα (χωρίς βέλος).'
    class_menu:
      label: 'Κλάση μενού (ριζικό <ul>)'
      placeholder: 'π.χ. nav flex-column'
    ul_id:
      label: 'Id του ul (ριζικό <ul>)'
      placeholder: 'π.χ. main-menu-navigation'
    class_item:
      label: 'Κλάση στοιχείου (<li>)'
      placeholder: 'π.χ. nav-item'
    class_link:
      label: 'Κλάση συνδέσμου (<a>)'
      placeholder: 'π.χ. nav-link'
    class_children:
      label: 'Κλάση θυγατρικών (ένθετο <ul>)'
      placeholder: 'π.χ. nav flex-column ms-2'
    class_section_children:
      label: 'Κλάση θυγατρικών ενότητας (<ul> κάτω από itemType "section")'
      placeholder: 'π.χ. nav flex-column list-unstyled ps-0 (επίπεδο· κενό = ίδιο με τα θυγατρικά)'
      help: 'Όταν οριστεί, η λίστα πρώτου επιπέδου κάτω από κάθε ενότητα χρησιμοποιεί αυτές τις κλάσεις αντί για την «Κλάση θυγατρικών», ώστε οι σύνδεσμοι να ευθυγραμμίζονται με τον τίτλο της ενότητας (χωρίς εσοχή). Αφήστε κενό για να συνεχίσει να χρησιμοποιείται η κλάση των ένθετων θυγατρικών.'
    class_section_child_item:
      label: 'Κλάση <li> για άμεσα θυγατρικά του itemType "section"'
      placeholder: 'π.χ. nav-item ms-0 (κενό = ίδιο με την Κλάση στοιχείου)'
      help: 'Όταν οριστεί, οι σύνδεσμοι και τα διαχωριστικά που είναι άμεσα θυγατρικά μιας ενότητας χρησιμοποιούν αυτήν την τιμή για την κλάση του <li> αντί για την «Κλάση στοιχείου». Χρησιμοποιήστε την για προσαρμογές περιθωρίου/εσωτερικού περιθωρίου σε επίπεδες λίστες ενοτήτων.'
    class_section_child_link:
      label: 'Κλάση <a> για άμεσα θυγατρικά του itemType "section"'
      placeholder: 'π.χ. d-flex align-items-center ps-0 (κενό = ίδιο με την Κλάση συνδέσμου)'
      help: 'Όταν οριστεί, οι σύνδεσμοι που είναι άμεσα θυγατρικά μιας ενότητας χρησιμοποιούν αυτήν την τιμή για την κλάση του <a> αντί για την «Κλάση συνδέσμου». Συνδυάζεται με το <li> θυγατρικού ενότητας για ευθυγράμμιση.'
    class_section_label:
      label: 'Κλάση ετικέτας ενότητας (itemType "section")'
      placeholder: 'π.χ. navigation-header'
    class_section:
      label: 'Κλάση ενότητας (<li> όταν itemType "section")'
      placeholder: 'π.χ. menu-section'
    class_divider:
      label: 'Κλάση διαχωριστικού (<li> όταν itemType "divider")'
      placeholder: 'π.χ. menu-divider'
    class_current:
      label: 'Κλάση τρέχοντος (σύνδεσμος που αντιστοιχεί στην τρέχουσα διαδρομή)'
      placeholder: 'π.χ. active'
    class_branch_expanded:
      label: 'Κλάση αναπτυγμένου κλάδου (<li> όταν η διαδρομή είναι στον κλάδο)'
      placeholder: 'π.χ. active-branch'
    class_has_children:
      label: 'Κλάση με θυγατρικά (<li> όταν το στοιχείο έχει θυγατρικά)'
      placeholder: 'π.χ. has-children'
    class_expanded:
      label: 'Κλάση αναπτυγμένου (<li> όταν το μπλοκ θυγατρικών είναι ανοιχτό)'
      placeholder: 'π.χ. is-expanded'
    class_collapsed:
      label: 'Κλάση συμπτυγμένου (<li> όταν το μπλοκ θυγατρικών είναι κλειστό)'
      placeholder: 'π.χ. is-collapsed'
    empty_choice: '— Κενό —'
    css_section_heading: 'Κλάσεις CSS για την απόδοση (υπερισχύουν της διαμόρφωσης όταν ορίζονται).'
    section_definition: 'Ορισμός (κωδικός, βασικό, όνομα, πλαίσιο, εικονίδιο)'
    section_config: 'Ρυθμίσεις (δικαιώματα, βάθος, πτυσσόμενο, CSS)'

