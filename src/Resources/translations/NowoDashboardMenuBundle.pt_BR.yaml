# Form: MenuType
form:
  menu_type:
    code:
      label: 'Código'
      help: 'Identificador único (letras, números, _ -). Em menus base, o código não pode ser alterado após a criação.'
      placeholder: 'ex.: sidebar'
    base:
      label: 'Menu base'
      help: 'Quando marcado, o código deste menu não poderá ser alterado após a criação.'
    name:
      label: 'Nome'
      placeholder: 'ex.: Barra lateral'
    context:
      label: 'Contexto'
      help: 'Pares chave-valor JSON opcionais para identificar esta variante do menu. Ao resolver por código, é usado o primeiro menu correspondente nos conjuntos de contexto ordenados; vazio = alternativa padrão para esse código.'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'Ícone'
      help: 'Identificador de ícone opcional (ex.: Symfony UX Icons: heroicons:home, bootstrap:house).'
      placeholder: 'ex.: heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: 'Verificador de permissões'
      placeholder: '— Permitir tudo —'
      allow_all: '— Permitir tudo —'
      permission_key_aware: '— Por chave de permissão (estrutura) —'
      help: 'Serviço que implementa MenuPermissionCheckerInterface (vazio = permitir tudo).'
    depth_limit:
      label: 'Limite de profundidade'
      placeholder: 'vazio = ilimitado'
      help: 'Profundidade máxima a renderizar (1 = apenas raiz, 2 = raiz + um nível; vazio = ilimitado).'
    collapsible:
      label: 'Recolhível (envolver o menu em um bloco alternável)'
    collapsible_expanded:
      label: 'Recolhível expandido (aberto por padrão)'
    nested_collapsible:
      label: 'Recolhível aninhado (itens com filhos têm alternador)'
    nested_collapsible_sections:
      label: 'Seções recolhíveis'
      help: 'Requer recolhível aninhado. Quando ativado, as linhas de seção exibem uma seta à direita e seus links podem ser recolhidos. Quando desativado, os filhos da seção ficam sempre expandidos (sem seta).'
    class_menu:
      label: 'Classe do menu (<ul> raiz)'
      placeholder: 'ex.: nav flex-column'
    ul_id:
      label: 'Id do ul (<ul> raiz)'
      placeholder: 'ex.: main-menu-navigation'
    class_item:
      label: 'Classe do item (<li>)'
      placeholder: 'ex.: nav-item'
    class_link:
      label: 'Classe do link (<a>)'
      placeholder: 'ex.: nav-link'
    class_children:
      label: 'Classe dos filhos (<ul> aninhado)'
      placeholder: 'ex.: nav flex-column ms-2'
    class_section_children:
      label: 'Classe dos filhos de seção (<ul> sob itemType "section")'
      placeholder: 'ex.: nav flex-column list-unstyled ps-0 (plano; vazio = igual aos filhos)'
      help: 'Quando definida, a lista de primeiro nível sob cada seção usa estas classes em vez de “Classe dos filhos”, para que os links possam se alinhar com o título da seção (sem recuo). Deixe vazio para continuar usando a classe dos filhos aninhados.'
    class_section_child_item:
      label: 'Classe <li> para filhos diretos de itemType "section"'
      placeholder: 'ex.: nav-item ms-0 (vazio = igual à Classe do item)'
      help: 'Quando definida, os links e divisores que são filhos diretos de uma seção usam esta classe no <li> em vez de “Classe do item”. Use para ajustes de margem/preenchimento em listas de seção planas.'
    class_section_child_link:
      label: 'Classe <a> para filhos diretos de itemType "section"'
      placeholder: 'ex.: d-flex align-items-center ps-0 (vazio = igual à Classe do link)'
      help: 'Quando definida, os links que são filhos diretos de uma seção usam esta classe no <a> em vez de “Classe do link”. Combina com a classe <li> dos filhos da seção para o alinhamento.'
    class_section_label:
      label: 'Classe do rótulo da seção (itemType "section")'
      placeholder: 'ex.: navigation-header'
    class_section:
      label: 'Classe da seção (<li> quando itemType "section")'
      placeholder: 'ex.: menu-section'
    class_divider:
      label: 'Classe do divisor (<li> quando itemType "divider")'
      placeholder: 'ex.: menu-divider'
    class_current:
      label: 'Classe atual (link que corresponde à rota atual)'
      placeholder: 'ex.: active'
    class_branch_expanded:
      label: 'Classe de ramo expandido (<li> quando a rota está no ramo)'
      placeholder: 'ex.: active-branch'
    class_has_children:
      label: 'Classe com filhos (<li> quando o item tem filhos)'
      placeholder: 'ex.: has-children'
    class_expanded:
      label: 'Classe expandido (<li> quando o bloco de filhos está aberto)'
      placeholder: 'ex.: is-expanded'
    class_collapsed:
      label: 'Classe recolhido (<li> quando o bloco de filhos está fechado)'
      placeholder: 'ex.: is-collapsed'
    empty_choice: '— Vazio —'
    css_section_heading: 'Classes CSS para renderização (substituem a configuração quando definidas).'
    section_definition: 'Definição (código, base, nome, contexto, ícone)'
    section_config: 'Configuração (permissões, profundidade, recolhível, CSS)'

  menu_item_type:
    section_basic: 'Identidade (rótulos)'
    section_icon: 'Identidade (tipo, posição, ícone)'
    section_config: 'Configuração (link, permissão)'
    label_required: 'O rótulo é obrigatório para Link e Seção.'
    label:
      label: 'Rótulo'
    label_locale: 'Rótulo (%locale%)'
    labels_by_locale: 'Rótulo por idioma'
    divider_label_hint: 'Nome opcional para este divisor (recomendado para acessibilidade e para a lista do painel). Deixe vazio se você precisa apenas de um separador visual.'
    type:
      label: 'Tipo'
      link: 'Link'
      section: 'Seção'
      divider: 'Divisor'
      service: 'Serviço (URL em tempo de execução)'
    link_resolver:
      label: 'Resolvedor de links'
      placeholder: '— Selecionar resolvedor —'
      help: 'Escolha um serviço que implemente MenuLinkResolverInterface. Ele pode retornar uma única URL ou uma lista de linhas de links filhos (rótulo, href, posição); nesse caso, o href do pai é "#".'
      service_id_placeholder: 'ex.: App\Menu\MyLinkResolver'
      help_free_text: 'Informe o id do serviço (nome da classe ou id do contêiner) que implementa MenuLinkResolverInterface.'
      required: 'Um resolvedor de links é obrigatório para o tipo de item “Serviço”.'
      route_params_hint: 'JSON opcional repassado ao resolvedor (por exemplo, parâmetros semelhantes aos de rota).'
    position:
      label: 'Posição'
    link_type:
      label: 'Tipo de link'
      route: 'Rota'
      external_url: 'URL externa'
    route_name:
      label: 'Nome da rota'
      placeholder: '— Selecionar rota —'
    route_params:
      label: 'Parâmetros da rota (JSON)'
      placeholder: '{}'
    external_url:
      label: 'URL externa'
      placeholder: 'https://...'
    target_blank:
      label: 'Abrir em nova aba'
    permission_keys:
      label: 'Chaves de permissão'
      placeholder: '— Permitir tudo —'
      help_csv: 'Chaves separadas por vírgula (usadas quando não há opções configuradas disponíveis).'
      choice:
        authenticated: 'Somente autenticados'
        admin: 'Somente administrador'
        path__: 'Caminho: / (somente página inicial)'
    is_unanimous:
      label: 'Exigir todas as chaves selecionadas'
      help: 'Ativado: todas as chaves devem ser satisfeitas (AND). Desativado: basta qualquer chave (OR).'
    icon:
      label: 'Ícone'
      placeholder: 'heroicons:home'
    parent:
      label: 'Pai'
      placeholder: '— Raiz (sem pai) —'
      help_inheritance: 'Os itens pais ficam acima deste na árvore. As chaves de permissão desta linha se aplicam a este item; o seu MenuPermissionChecker decide como as regras de pai/filho se combinam. Seções e links expansíveis só são renderizados quando pelo menos um filho é exibido.'
      circular_violation: 'Não é permitida uma hierarquia circular de pais.'
      section_must_be_root: 'Itens de seção devem permanecer no nível raiz (sem pai).'
    section_collapsible:
      label: 'Filhos da seção recolhíveis'
      inherit: 'Usar padrão do menu'
      yes: 'Sim (recolhível com seta)'
      no: 'Não (sempre expandido)'
      help: 'Substitui a opção do menu “Seções recolhíveis” apenas para esta seção. “Usar padrão do menu” segue a configuração do menu.'

  import_menu_type:
    file:
      label: 'Arquivo JSON'
      required: 'Selecione um arquivo.'
      mime_message: 'O arquivo deve ser JSON.'
    strategy:
      label: 'Quando já existir um menu com o mesmo código e contexto'
      skip_existing: 'Ignorar (não importar)'
      replace: 'Substituir (excluir os itens existentes e importar)'

  copy_menu_type:
    code:
      label: 'Código'
      placeholder: 'ex.: sidebar_copy'
      regex_message: 'O código deve conter apenas letras, números, sublinhado e hífen.'
    name:
      label: 'Nome'
      placeholder: 'ex.: Barra lateral (cópia)'
