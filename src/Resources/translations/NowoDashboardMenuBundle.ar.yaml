      label: 'فئة <a> للعناصر الفرعية المباشرة لـ itemType "section"'
      placeholder: 'مثال: d-flex align-items-center ps-0 (فارغ = نفس فئة الرابط)'
      help: 'عند تعيينها، تستخدم الروابط التي هي عناصر فرعية مباشرة لقسم ما هذه القيمة كفئة لـ <a> بدلًا من «فئة الرابط». تُستخدم مع فئة <li> للعناصر الفرعية للقسم لضبط المحاذاة.'
    class_section_label:
      label: 'فئة تسمية القسم (itemType "section")'
      placeholder: 'مثال: navigation-header'
    class_section:
      label: 'فئة القسم (<li> عندما يكون itemType "section")'
      placeholder: 'مثال: menu-section'
    class_divider:
      label: 'فئة الفاصل (<li> عندما يكون itemType "divider")'
