      label: 'فئة العناصر الفرعية للقسم (<ul> تحت itemType "section")'
      placeholder: 'مثال: nav flex-column list-unstyled ps-0 (مسطحة؛ فارغ = نفس العناصر الفرعية)'
      help: 'عند تعيينها، تستخدم القائمة من المستوى الأول تحت كل قسم هذه الفئات بدلًا من «فئة العناصر الفرعية»، بحيث تتحاذى الروابط مع عنوان القسم (بدون إزاحة). اتركها فارغة لمواصلة استخدام فئة العناصر الفرعية المتداخلة.'
    class_section_child_item:
      label: 'فئة <li> للعناصر الفرعية المباشرة لـ itemType "section"'
      placeholder: 'مثال: nav-item ms-0 (فارغ = نفس فئة العنصر)'
      help: 'عند تعيينها، تستخدم الروابط والفواصل التي هي عناصر فرعية مباشرة لقسم ما هذه القيمة كفئة لـ <li> بدلًا من «فئة العنصر». استخدمها لضبط الهوامش/الحشو تحت قوائم الأقسام المسطحة.'
