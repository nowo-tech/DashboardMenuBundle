# Form: MenuType
form:
  menu_type:
    code:
      label: 'الرمز'
      help: 'معرّف فريد (حروف وأرقام و _ -). بالنسبة للقوائم الأساسية، لا يمكن تغيير الرمز بعد الإنشاء.'
      placeholder: 'مثال: sidebar'
    base:
      label: 'قائمة أساسية'
      help: 'عند التحديد، لا يمكن تغيير رمز هذه القائمة بعد الإنشاء.'
    name:
      label: 'الاسم'
      placeholder: 'مثال: الشريط الجانبي'
    context:
      label: 'السياق'
      help: 'أزواج مفتاح-قيمة اختيارية بصيغة JSON لتمييز هذا الإصدار من القائمة. عند البحث بالرمز، تُستخدم أول قائمة مطابقة في مجموعات السياق المرتبة؛ الفارغ = القائمة الاحتياطية لذلك الرمز.'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'الأيقونة'
      help: 'معرّف أيقونة اختياري (مثال: Symfony UX Icons: heroicons:home، bootstrap:house).'
      placeholder: 'مثال: heroicons:bars-3، bootstrap:list'
    permission_checker:
      label: 'مدقق الأذونات'
      placeholder: '— السماح للجميع —'
      allow_all: '— السماح للجميع —'
      permission_key_aware: '— حسب مفتاح الإذن (البنية) —'
      help: 'خدمة تطبّق MenuPermissionCheckerInterface (فارغ = السماح للجميع).'
    depth_limit:
      label: 'حد العمق'
      placeholder: 'فارغ = بلا حد'
      help: 'أقصى عمق للعرض (1 = الجذر فقط، 2 = الجذر + مستوى واحد؛ فارغ = بلا حد).'
    collapsible:
      label: 'قابلة للطي (تغليف القائمة في كتلة قابلة للتبديل)'
    collapsible_expanded:
      label: 'قابلة للطي ومفتوحة (مفتوحة افتراضيًا)'
    nested_collapsible:
      label: 'طي متداخل (العناصر ذات العناصر الفرعية لها زر تبديل)'
    nested_collapsible_sections:
      label: 'أقسام قابلة للطي'
      help: 'يتطلب تفعيل الطي المتداخل. عند التفعيل، تعرض صفوف الأقسام سهمًا على اليمين ويمكن طي روابطها. عند التعطيل، تبقى العناصر الفرعية للأقسام مفتوحة دائمًا (بدون سهم).'
    class_menu:
      label: 'فئة القائمة (<ul> الجذري)'
      placeholder: 'مثال: nav flex-column'
    ul_id:
      label: 'معرّف ul (<ul> الجذري)'
      placeholder: 'مثال: main-menu-navigation'
    class_item:
      label: 'فئة العنصر (<li>)'
      placeholder: 'مثال: nav-item'
    class_link:
      label: 'فئة الرابط (<a>)'
      placeholder: 'مثال: nav-link'
