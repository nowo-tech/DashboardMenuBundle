    section_basic: 'Identita (štítky)'
    section_icon: 'Identita (typ, pozícia, ikona)'
    section_config: 'Konfigurácia (odkaz, oprávnenie)'
    label_required: 'Štítok je povinný pre Odkaz a Sekciu.'
    label:
