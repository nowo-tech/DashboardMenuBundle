# Form: MenuType
form:
  menu_type:
    code:
      label: 'Kód'
      help: 'Jedinečný identifikátor (písmená, číslice, _ -). Pri základných menu nie je možné kód po vytvorení zmeniť.'
      placeholder: 'napr. sidebar'
    base:
      label: 'Základné menu'
      help: 'Ak je začiarknuté, kód tohto menu nie je možné po vytvorení zmeniť.'
    name:
      label: 'Názov'
      placeholder: 'napr. Bočný panel'
    context:
      label: 'Kontext'
      help: 'Voliteľné páry kľúč-hodnota v JSON na identifikáciu tejto varianty menu. Pri vyhľadávaní podľa kódu sa použije prvé zodpovedajúce menu v usporiadaných množinách kontextov; prázdne = predvolené pre daný kód.'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'Ikona'
      help: 'Voliteľný identifikátor ikony (napr. Symfony UX Icons: heroicons:home, bootstrap:house).'
      placeholder: 'napr. heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: 'Kontrola oprávnení'
      placeholder: '— Povoliť všetko —'
      allow_all: '— Povoliť všetko —'
      permission_key_aware: '— Podľa kľúča oprávnenia (štruktúra) —'
      help: 'Služba implementujúca MenuPermissionCheckerInterface (prázdne = povoliť všetko).'
    depth_limit:
      label: 'Limit hĺbky'
      placeholder: 'prázdne = bez obmedzenia'
      help: 'Maximálna vykresľovaná hĺbka (1 = iba koreň, 2 = koreň + jedna úroveň; prázdne = bez obmedzenia).'
    collapsible:
      label: 'Zbaliteľné (obaliť menu do prepínacieho bloku)'
    collapsible_expanded:
      label: 'Zbaliteľné, rozbalené (predvolene otvorené)'
    nested_collapsible:
      label: 'Vnorené zbaliteľné (položky s podradenými položkami majú prepínač)'
    nested_collapsible_sections:
      label: 'Zbaliteľné sekcie'
      help: 'Vyžaduje vnorené zbaliteľné. Ak je zapnuté, riadky sekcií zobrazujú vpravo šípku a ich odkazy je možné zbaliť. Ak je vypnuté, podradené položky sekcií zostávajú vždy rozbalené (bez šípky).'
    class_menu:
      label: 'Trieda menu (koreňový <ul>)'
      placeholder: 'napr. nav flex-column'
    ul_id:
      label: 'ID ul (koreňový <ul>)'
      placeholder: 'napr. main-menu-navigation'
    class_item:
      label: 'Trieda položky (<li>)'
      placeholder: 'napr. nav-item'
    class_link:
      label: 'Trieda odkazu (<a>)'
      placeholder: 'napr. nav-link'
    class_children:
      label: 'Trieda podradených (vnorený <ul>)'
      placeholder: 'napr. nav flex-column ms-2'
    class_section_children:
      label: 'Trieda podradených sekcie (<ul> pod itemType "section")'
      placeholder: 'napr. nav flex-column list-unstyled ps-0 (ploché; prázdne = rovnaké ako podradené)'
      help: 'Ak je nastavené, zoznam prvej úrovne pod každou sekciou použije tieto triedy namiesto „Trieda podradených“, takže odkazy môžu byť zarovnané s nadpisom sekcie (bez odsadenia). Ponechajte prázdne, ak chcete naďalej používať triedu vnorených podradených položiek.'
    class_section_child_item:
      label: 'Trieda <li> pre priame podradené položky itemType "section"'
      placeholder: 'napr. nav-item ms-0 (prázdne = rovnaké ako Trieda položky)'
      help: 'Ak je nastavené, odkazy a oddeľovače, ktoré sú priamymi podradenými položkami sekcie, použijú túto hodnotu ako triedu <li> namiesto „Trieda položky“. Použite na úpravu okrajov/odsadenia v plochých zoznamoch sekcií.'
    class_section_child_link:
      label: 'Trieda <a> pre priame podradené položky itemType "section"'
      placeholder: 'napr. d-flex align-items-center ps-0 (prázdne = rovnaké ako Trieda odkazu)'
      help: 'Ak je nastavené, odkazy, ktoré sú priamymi podradenými položkami sekcie, použijú túto hodnotu ako triedu <a> namiesto „Trieda odkazu“. Kombinuje sa s <li> podradených položiek sekcie kvôli zarovnaniu.'
    class_section_label:
      label: 'Trieda štítku sekcie (itemType "section")'
      placeholder: 'napr. navigation-header'
    class_section:
      label: 'Trieda sekcie (<li> pri itemType "section")'
      placeholder: 'napr. menu-section'
    class_divider:
      label: 'Trieda oddeľovača (<li> pri itemType "divider")'
      placeholder: 'napr. menu-divider'
    class_current:
      label: 'Trieda aktuálnej (odkaz zodpovedajúci aktuálnej trase)'
      placeholder: 'napr. active'
    class_branch_expanded:
      label: 'Trieda rozbalenej vetvy (<li>, keď je trasa vo vetve)'
      placeholder: 'napr. active-branch'
    class_has_children:
      label: 'Trieda s podradenými (<li>, keď má položka podradené položky)'
      placeholder: 'napr. has-children'
    class_expanded:
      label: 'Trieda rozbalené (<li>, keď je blok podradených otvorený)'
      placeholder: 'napr. is-expanded'
    class_collapsed:
      label: 'Trieda zbalené (<li>, keď je blok podradených zatvorený)'
      placeholder: 'napr. is-collapsed'
    empty_choice: '— Prázdne —'
    css_section_heading: 'Triedy CSS na vykresľovanie (ak sú nastavené, prepíšu konfiguráciu).'
    section_definition: 'Definícia (kód, základné, názov, kontext, ikona)'
    section_config: 'Konfigurácia (oprávnenia, hĺbka, zbaliteľnosť, CSS)'

