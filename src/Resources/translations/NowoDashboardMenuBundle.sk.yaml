      label: 'Resolver odkazov'
      placeholder: '— Vyberte resolver —'
      help: 'Vyberte službu, ktorá implementuje MenuLinkResolverInterface. Môže vrátiť jednu URL alebo zoznam riadkov podradených odkazov (štítok, href, pozícia); href nadradenej položky je potom "#".'
      service_id_placeholder: 'napr. App\Menu\MyLinkResolver'
      help_free_text: 'Zadajte ID služby (názov triedy alebo ID v kontajneri), ktorá implementuje MenuLinkResolverInterface.'
      required: 'Pre typ položky „Služba“ je povinný resolver odkazov.'
