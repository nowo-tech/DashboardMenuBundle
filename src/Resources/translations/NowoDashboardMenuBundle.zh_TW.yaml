# Form: MenuType
form:
  menu_type:
    code:
      label: '代碼'
      help: '唯一識別碼（字母、數字、_ -）。基礎選單的代碼在建立後無法變更。'
      placeholder: '例如 sidebar'
    base:
      label: '基礎選單'
      help: '勾選後，此選單的代碼在建立後將無法變更。'
    name:
      label: '名稱'
      placeholder: '例如 側邊欄'
    context:
      label: '情境'
      help: '選用的 JSON 鍵值對，用於識別此選單變體。依代碼解析時，會使用有序情境集合中第一個符合的選單；留空 = 該代碼的備援選單。'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: '圖示'
      help: '選用的圖示識別碼（例如 Symfony UX Icons：heroicons:home、bootstrap:house）。'
      placeholder: '例如 heroicons:bars-3、bootstrap:list'
    permission_checker:
      label: '權限檢查器'
      placeholder: '— 全部允許 —'
      allow_all: '— 全部允許 —'
      permission_key_aware: '— 依權限鍵（結構）—'
      help: '實作 MenuPermissionCheckerInterface 的服務（留空 = 全部允許）。'
    depth_limit:
      label: '深度限制'
      placeholder: '留空 = 不限制'
      help: '要呈現的最大深度（1 = 僅根層，2 = 根層 + 一層；留空 = 不限制）。'
    collapsible:
      label: '可收合（將選單包在切換區塊中）'
    collapsible_expanded:
      label: '可收合且展開（預設開啟）'
    nested_collapsible:
      label: '巢狀可收合（有子項目的項目具備切換按鈕）'
    nested_collapsible_sections:
      label: '可收合區段'
      help: '需要啟用巢狀可收合。啟用時，區段列右側會顯示箭頭，其連結可以收合。停用時，區段的子項目一律展開（無箭頭）。'
    class_menu:
      label: '選單類別（根 <ul>）'
      placeholder: '例如 nav flex-column'
    ul_id:
      label: 'Ul ID（根 <ul>）'
      placeholder: '例如 main-menu-navigation'
    class_item:
      label: '項目類別（<li>）'
      placeholder: '例如 nav-item'
    class_link:
      label: '連結類別（<a>）'
      placeholder: '例如 nav-link'
    class_children:
      label: '子層類別（巢狀 <ul>）'
      placeholder: '例如 nav flex-column ms-2'
    class_section_children:
      label: '區段子層類別（itemType "section" 下的 <ul>）'
      placeholder: '例如 nav flex-column list-unstyled ps-0（扁平；留空 = 與子層類別相同）'
      help: '設定後，每個區段下的第一層清單會改用這些類別而非「子層類別」，讓連結能與區段標題對齊（無縮排）。留空則繼續使用巢狀子層類別。'
    class_section_child_item:
      label: 'itemType "section" 直接子項目的 <li> 類別'
      placeholder: '例如 nav-item ms-0（留空 = 與項目類別相同）'
      help: '設定後，作為區段直接子項目的連結與分隔線會以此作為 <li> 類別，而非「項目類別」。可用於微調扁平區段清單下的外距/內距。'
    class_section_child_link:
      label: 'itemType "section" 直接子項目的 <a> 類別'
      placeholder: '例如 d-flex align-items-center ps-0（留空 = 與連結類別相同）'
      help: '設定後，作為區段直接子項目的連結會以此作為 <a> 類別，而非「連結類別」。可搭配區段子項目的 <li> 類別進行對齊。'
    class_section_label:
      label: '區段標籤類別（itemType "section"）'
      placeholder: '例如 navigation-header'
    class_section:
      label: '區段類別（itemType "section" 時的 <li>）'
      placeholder: '例如 menu-section'
    class_divider:
      label: '分隔線類別（itemType "divider" 時的 <li>）'
      placeholder: '例如 menu-divider'
    class_current:
      label: '目前項目類別（符合目前路由的連結）'
      placeholder: '例如 active'
    class_branch_expanded:
      label: '分支展開類別（路由位於分支內時的 <li>）'
      placeholder: '例如 active-branch'
    class_has_children:
      label: '含子項目類別（項目有子項目時的 <li>）'
      placeholder: '例如 has-children'
    class_expanded:
      label: '展開類別（子項目區塊開啟時的 <li>）'
      placeholder: '例如 is-expanded'
    class_collapsed:
      label: '收合類別（子項目區塊關閉時的 <li>）'
      placeholder: '例如 is-collapsed'
    empty_choice: '— 空白 —'
    css_section_heading: '用於呈現的 CSS 類別（設定後會覆寫組態）。'
    section_definition: '定義（代碼、基礎、名稱、情境、圖示）'
    section_config: '設定（權限、深度、可收合、CSS）'

  menu_item_type:
    section_basic: '識別（標籤）'
    section_icon: '識別（類型、位置、圖示）'
    section_config: '設定（連結、權限）'
    label_required: '連結與區段必須填寫標籤。'
    label:
      label: '標籤'
    label_locale: '標籤（%locale%）'
    labels_by_locale: '依語言的標籤'
    divider_label_hint: '此分隔線的選用名稱（建議填寫，以利無障礙存取及管理面板清單辨識）。若只需要視覺分隔，請留空。'
    type:
      label: '類型'
      link: '連結'
      section: '區段'
      divider: '分隔線'
      service: '服務（執行階段 URL）'
    link_resolver:
      label: '連結解析器'
      placeholder: '— 選擇解析器 —'
      help: '選擇實作 MenuLinkResolverInterface 的服務。它可以傳回單一 URL，或子連結列的清單（label、href、position）；此時父層的 href 為 "#"。'
      service_id_placeholder: '例如 App\Menu\MyLinkResolver'
      help_free_text: '輸入實作 MenuLinkResolverInterface 的服務 ID（類別名稱或容器 ID）。'
      required: '項目類型為「服務」時必須指定連結解析器。'
      route_params_hint: '傳遞給解析器的選用 JSON（例如類似路由的參數）。'
    position:
      label: '位置'
    link_type:
      label: '連結類型'
      route: '路由'
      external_url: '外部 URL'
    route_name:
      label: '路由名稱'
      placeholder: '— 選擇路由 —'
    route_params:
      label: '路由參數（JSON）'
      placeholder: '{}'
    external_url:
      label: '外部 URL'
      placeholder: 'https://...'
    target_blank:
      label: '在新分頁中開啟'
    permission_keys:
      label: '權限鍵'
      placeholder: '— 全部允許 —'
      help_csv: '以逗號分隔的鍵（在沒有可用的已設定選項時使用）。'
      choice:
        authenticated: '僅限已登入使用者'
        admin: '僅限管理員'
        path__: '路徑：/（僅首頁）'
    is_unanimous:
      label: '必須符合所有已選取的鍵'
      help: '啟用：所有鍵皆須通過（AND）。停用：任一鍵通過即可（OR）。'
    icon:
      label: '圖示'
      placeholder: 'heroicons:home'
    parent:
      label: '父層'
      placeholder: '— 根層（無父層）—'
      help_inheritance: '父層項目在樹狀結構中位於此項目之上。此列的權限鍵套用於此項目；父層/子層規則如何組合由您的 MenuPermissionChecker 決定。區段與可展開的連結只有在至少顯示一個子項目時才會呈現。'
      circular_violation: '不允許循環的父層階層。'
      section_must_be_root: '區段項目必須保持在根層級（無父層）。'
    section_collapsible:
      label: '區段子項目可收合'
      inherit: '使用選單預設值'
      yes: '是（可收合，附箭頭）'
      no: '否（一律展開）'
      help: '僅針對此區段覆寫選單選項「可收合區段」。「使用選單預設值」會依循選單設定。'

  import_menu_type:
    file:
      label: 'JSON 檔案'
      required: '請選擇檔案。'
      mime_message: '檔案必須是 JSON 格式。'
    strategy:
      label: '當已存在具有相同代碼與情境的選單時'
      skip_existing: '略過（不匯入）'
      replace: '取代（刪除現有項目後匯入）'

  copy_menu_type:
    code:
      label: '代碼'
      placeholder: '例如 sidebar_copy'
      regex_message: '代碼只能包含字母、數字、底線與連字號。'
    name:
      label: '名稱'
      placeholder: '例如 側邊欄（副本）'
