# Form: MenuType
form:
  menu_type:
    code:
      label: 'コード'
      help: '一意の識別子（英字、数字、_ -）。基本メニューの場合、作成後にコードを変更することはできません。'
      placeholder: '例: sidebar'
    base:
      label: '基本メニュー'
      help: 'チェックすると、作成後にこのメニューのコードを変更できなくなります。'
    name:
      label: '名前'
      placeholder: '例: サイドバー'
    context:
      label: 'コンテキスト'
      help: 'このメニューのバリアントを識別するための任意の JSON キーと値のペア。コードで解決する際は、順序付けられたコンテキストセットの中で最初に一致したメニューが使用されます。空 = そのコードのフォールバック。'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'アイコン'
      help: '任意のアイコン識別子（例: Symfony UX Icons: heroicons:home, bootstrap:house）。'
      placeholder: '例: heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: '権限チェッカー'
      placeholder: '— すべて許可 —'
      allow_all: '— すべて許可 —'
      permission_key_aware: '— 権限キーによる（構造） —'
      help: 'MenuPermissionCheckerInterface を実装したサービス（空 = すべて許可）。'
    depth_limit:
      label: '深さの上限'
      placeholder: '空 = 無制限'
      help: '描画する最大の深さ（1 = ルートのみ、2 = ルート + 1 階層。空 = 無制限）。'
    collapsible:
      label: '折りたたみ可能（メニューを開閉ブロックで囲む）'
    collapsible_expanded:
      label: '折りたたみ可能・展開状態（既定で開く）'
    nested_collapsible:
      label: '入れ子の折りたたみ（子を持つ項目に開閉ボタンを表示）'
    nested_collapsible_sections:
      label: 'セクションを折りたたみ可能にする'
      help: '入れ子の折りたたみが必要です。有効にすると、セクション行の右側にシェブロンが表示され、そのリンクを折りたたむことができます。無効にすると、セクションの子は常に展開されたままになります（シェブロンなし）。'
    class_menu:
      label: 'メニューのクラス（ルートの <ul>）'
      placeholder: '例: nav flex-column'
    ul_id:
      label: 'ul の ID（ルートの <ul>）'
      placeholder: '例: main-menu-navigation'
    class_item:
      label: '項目のクラス（<li>）'
      placeholder: '例: nav-item'
    class_link:
      label: 'リンクのクラス（<a>）'
      placeholder: '例: nav-link'
    class_children:
      label: '子のクラス（入れ子の <ul>）'
      placeholder: '例: nav flex-column ms-2'
    class_section_children:
      label: 'セクションの子のクラス（itemType "section" 配下の <ul>）'
      placeholder: '例: nav flex-column list-unstyled ps-0（フラット。空 = 子のクラスと同じ）'
      help: '設定すると、各セクション直下の第 1 階層のリストに「子のクラス」の代わりにこれらのクラスが使用され、リンクをセクションタイトルに揃える（インデントなし）ことができます。空のままにすると、入れ子の子のクラスが引き続き使用されます。'
    class_section_child_item:
      label: 'itemType "section" の直接の子の <li> クラス'
      placeholder: '例: nav-item ms-0（空 = 項目のクラスと同じ）'
      help: '設定すると、セクションの直接の子であるリンクと区切り線の <li> クラスに「項目のクラス」の代わりにこの値が使用されます。フラットなセクションリスト内のマージン／パディング調整に使用します。'
    class_section_child_link:
      label: 'itemType "section" の直接の子の <a> クラス'
      placeholder: '例: d-flex align-items-center ps-0（空 = リンクのクラスと同じ）'
      help: '設定すると、セクションの直接の子であるリンクの <a> クラスに「リンクのクラス」の代わりにこの値が使用されます。位置揃えのため、セクションの子の <li> と組み合わせて使用します。'
    class_section_label:
      label: 'セクションラベルのクラス（itemType "section"）'
      placeholder: '例: navigation-header'
    class_section:
      label: 'セクションのクラス（itemType "section" の場合の <li>）'
      placeholder: '例: menu-section'
    class_divider:
      label: '区切り線のクラス（itemType "divider" の場合の <li>）'
      placeholder: '例: menu-divider'
    class_current:
      label: '現在位置のクラス（現在のルートに一致するリンク）'
      placeholder: '例: active'
    class_branch_expanded:
      label: '展開ブランチのクラス（ルートがブランチ内にある場合の <li>）'
      placeholder: '例: active-branch'
    class_has_children:
      label: '子あり時のクラス（項目に子がある場合の <li>）'
      placeholder: '例: has-children'
    class_expanded:
      label: '展開時のクラス（子ブロックが開いている場合の <li>）'
      placeholder: '例: is-expanded'
    class_collapsed:
      label: '折りたたみ時のクラス（子ブロックが閉じている場合の <li>）'
      placeholder: '例: is-collapsed'
    empty_choice: '— 空 —'
    css_section_heading: '描画用の CSS クラス（設定した場合は構成を上書きします）。'
    section_definition: '定義（コード、基本、名前、コンテキスト、アイコン）'
    section_config: '設定（権限、深さ、折りたたみ、CSS）'

  menu_item_type:
    section_basic: '基本情報（ラベル）'
    section_icon: '基本情報（タイプ、位置、アイコン）'
    section_config: '設定（リンク、権限）'
    label_required: 'リンクとセクションにはラベルが必須です。'
    label:
      label: 'ラベル'
    label_locale: 'ラベル（%locale%）'
    labels_by_locale: '言語別ラベル'
    divider_label_hint: 'この区切り線の任意の名前（アクセシビリティとダッシュボードの一覧のために推奨）。視覚的な区切りだけが必要な場合は空のままにしてください。'
    type:
      label: 'タイプ'
      link: 'リンク'
      section: 'セクション'
      divider: '区切り線'
      service: 'サービス（実行時 URL）'
    link_resolver:
      label: 'リンクリゾルバー'
      placeholder: '— リゾルバーを選択 —'
      help: 'MenuLinkResolverInterface を実装したサービスを選択してください。単一の URL、または子リンク行（ラベル、href、位置）のリストを返すことができます。その場合、親の href は "#" になります。'
      service_id_placeholder: '例: App\Menu\MyLinkResolver'
      help_free_text: 'MenuLinkResolverInterface を実装したサービス ID（クラス名またはコンテナ ID）を入力してください。'
      required: '項目タイプ「サービス」にはリンクリゾルバーが必要です。'
      route_params_hint: 'リゾルバーに渡す任意の JSON（例: ルートのようなパラメーター）。'
    position:
      label: '位置'
    link_type:
      label: 'リンクの種類'
      route: 'ルート'
      external_url: '外部 URL'
    route_name:
      label: 'ルート名'
      placeholder: '— ルートを選択 —'
    route_params:
      label: 'ルートパラメーター（JSON）'
      placeholder: '{}'
    external_url:
      label: '外部 URL'
      placeholder: 'https://...'
    target_blank:
      label: '新しいタブで開く'
    permission_keys:
      label: '権限キー'
      placeholder: '— すべて許可 —'
      help_csv: 'カンマ区切りのキー（設定済みの選択肢がない場合に使用）。'
      choice:
        authenticated: '認証済みユーザーのみ'
        admin: '管理者のみ'
        path__: 'パス: /（ホームのみ）'
    is_unanimous:
      label: '選択したすべてのキーを必須にする'
      help: '有効: すべてのキーを満たす必要があります（AND）。無効: いずれかのキーを満たせば可（OR）。'
    icon:
      label: 'アイコン'
      placeholder: 'heroicons:home'
    parent:
      label: '親'
      placeholder: '— ルート（親なし） —'
      help_inheritance: '親項目はツリー内でこの項目の上位にあります。この行の権限キーはこの項目に適用されます。親と子のルールの組み合わせ方は MenuPermissionChecker が決定します。セクションと展開可能なリンクは、少なくとも 1 つの子が表示される場合にのみ描画されます。'
      circular_violation: '循環する親階層は許可されていません。'
      section_must_be_root: 'セクション項目はルート階層に置く必要があります（親なし）。'
    section_collapsible:
      label: 'セクションの子を折りたたみ可能にする'
      inherit: 'メニューの既定値を使用'
      yes: 'はい（シェブロン付きで折りたたみ可能）'
      no: 'いいえ（常に展開）'
      help: 'このセクションに限り、メニューのオプション「セクションを折りたたみ可能にする」を上書きします。「メニューの既定値を使用」はメニューの設定に従います。'

  import_menu_type:
    file:
      label: 'JSON ファイル'
      required: 'ファイルを選択してください。'
      mime_message: 'ファイルは JSON である必要があります。'
    strategy:
      label: '同じコードとコンテキストのメニューが既に存在する場合'
      skip_existing: 'スキップ（インポートしない）'
      replace: '置き換え（既存の項目を削除してインポート）'

  copy_menu_type:
    code:
      label: 'コード'
      placeholder: '例: sidebar_copy'
      regex_message: 'コードには英字、数字、アンダースコア、ハイフンのみ使用できます。'
    name:
      label: '名前'
      placeholder: '例: サイドバー（コピー）'
