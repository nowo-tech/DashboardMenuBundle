# Form: MenuType
form:
  menu_type:
    code:
      label: '코드'
      help: '고유 식별자(문자, 숫자, _ -). 기본 메뉴의 경우 생성 후에는 코드를 변경할 수 없습니다.'
      placeholder: '예: sidebar'
    base:
      label: '기본 메뉴'
      help: '선택하면 생성 후 이 메뉴의 코드를 변경할 수 없습니다.'
    name:
      label: '이름'
      placeholder: '예: 사이드바'
    context:
      label: '컨텍스트'
      help: '이 메뉴 변형을 식별하기 위한 선택적 JSON 키-값 쌍입니다. 코드로 확인할 때 정렬된 컨텍스트 집합에서 처음 일치하는 메뉴가 사용됩니다. 비어 있음 = 해당 코드의 대체값.'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: '아이콘'
      help: '선택적 아이콘 식별자(예: Symfony UX Icons: heroicons:home, bootstrap:house).'
      placeholder: '예: heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: '권한 검사기'
      placeholder: '— 모두 허용 —'
      allow_all: '— 모두 허용 —'
      permission_key_aware: '— 권한 키 기준(구조) —'
      help: 'MenuPermissionCheckerInterface를 구현하는 서비스(비어 있음 = 모두 허용).'
    depth_limit:
      label: '깊이 제한'
      placeholder: '비어 있음 = 무제한'
      help: '렌더링할 최대 깊이(1 = 루트만, 2 = 루트 + 한 수준, 비어 있음 = 무제한).'
    collapsible:
      label: '접기 가능(메뉴를 토글 블록으로 감싸기)'
    collapsible_expanded:
      label: '접기 가능, 펼침(기본적으로 열림)'
    nested_collapsible:
      label: '중첩 접기(하위 항목이 있는 항목에 토글 표시)'
    nested_collapsible_sections:
      label: '접을 수 있는 섹션'
      help: '중첩 접기가 필요합니다. 활성화하면 섹션 행 오른쪽에 화살표가 표시되고 해당 링크를 접을 수 있습니다. 비활성화하면 섹션의 하위 항목이 항상 펼쳐진 상태로 유지됩니다(화살표 없음).'
    class_menu:
      label: '메뉴 클래스(루트 <ul>)'
      placeholder: '예: nav flex-column'
    ul_id:
      label: 'ul ID(루트 <ul>)'
      placeholder: '예: main-menu-navigation'
    class_item:
      label: '항목 클래스(<li>)'
      placeholder: '예: nav-item'
    class_link:
      label: '링크 클래스(<a>)'
      placeholder: '예: nav-link'
    class_children:
      label: '하위 클래스(중첩 <ul>)'
      placeholder: '예: nav flex-column ms-2'
    class_section_children:
      label: '섹션 하위 클래스(itemType "section" 아래의 <ul>)'
      placeholder: '예: nav flex-column list-unstyled ps-0(평면, 비어 있음 = 하위 클래스와 동일)'
      help: '설정하면 각 섹션 아래의 첫 번째 수준 목록에 “하위 클래스” 대신 이 클래스가 사용되어 링크를 섹션 제목에 맞춰 정렬할 수 있습니다(들여쓰기 없음). 중첩 하위 클래스를 계속 사용하려면 비워 두세요.'
    class_section_child_item:
      label: 'itemType "section"의 직계 하위 항목용 <li> 클래스'
      placeholder: '예: nav-item ms-0(비어 있음 = 항목 클래스와 동일)'
      help: '설정하면 섹션의 직계 하위 항목인 링크와 구분선의 <li> 클래스에 “항목 클래스” 대신 이 값이 사용됩니다. 평면 섹션 목록 아래의 여백/패딩 조정에 사용하세요.'
    class_section_child_link:
      label: 'itemType "section"의 직계 하위 항목용 <a> 클래스'
      placeholder: '예: d-flex align-items-center ps-0(비어 있음 = 링크 클래스와 동일)'
      help: '설정하면 섹션의 직계 하위 항목인 링크의 <a> 클래스에 “링크 클래스” 대신 이 값이 사용됩니다. 정렬을 위해 섹션 하위 <li>와 함께 사용합니다.'
