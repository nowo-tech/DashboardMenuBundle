# Form: MenuType
form:
  menu_type:
    code:
      label: 'קוד'
      help: 'מזהה ייחודי (אותיות, ספרות, _ -). בתפריטי בסיס לא ניתן לשנות את הקוד לאחר היצירה.'
      placeholder: 'לדוגמה sidebar'
    base:
      label: 'תפריט בסיס'
      help: 'כאשר מסומן, לא ניתן לשנות את הקוד של תפריט זה לאחר היצירה.'
    name:
      label: 'שם'
      placeholder: 'לדוגמה סרגל צד'
    context:
      label: 'הקשר'
      help: 'זוגות מפתח-ערך אופציונליים ב-JSON לזיהוי גרסה זו של התפריט. בעת איתור לפי קוד, נעשה שימוש בתפריט התואם הראשון לפי סדר קבוצות ההקשר; ריק = ברירת מחדל חלופית עבור קוד זה.'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'סמל'
      help: 'מזהה סמל אופציונלי (לדוגמה Symfony UX Icons: heroicons:home, bootstrap:house).'
      placeholder: 'לדוגמה heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: 'בודק הרשאות'
      placeholder: '— לאפשר הכול —'
      allow_all: '— לאפשר הכול —'
      permission_key_aware: '— לפי מפתח הרשאה (מבנה) —'
      help: 'שירות המממש את MenuPermissionCheckerInterface (ריק = לאפשר הכול).'
    depth_limit:
      label: 'מגבלת עומק'
      placeholder: 'ריק = ללא הגבלה'
      help: 'עומק מרבי להצגה (1 = שורש בלבד, 2 = שורש + רמה אחת; ריק = ללא הגבלה).'
    collapsible:
      label: 'מתקפל (עטיפת התפריט בבלוק נפתח)'
    collapsible_expanded:
      label: 'מתקפל ופתוח (פתוח כברירת מחדל)'
    nested_collapsible:
      label: 'מתקפל מקונן (לפריטים עם צאצאים יש מתג פתיחה)'
    nested_collapsible_sections:
      label: 'מקטעים מתקפלים'
      help: 'דורש מתקפל מקונן. כאשר מופעל, שורות המקטעים מציגות חץ בצד ימין וניתן לקפל את הקישורים שלהן. כאשר מושבת, צאצאי המקטעים נשארים תמיד פתוחים (ללא חץ).'
    class_menu:
      label: 'מחלקת תפריט (<ul> שורש)'
      placeholder: 'לדוגמה nav flex-column'
    ul_id:
      label: 'מזהה ה-ul (<ul> שורש)'
      placeholder: 'לדוגמה main-menu-navigation'
    class_item:
      label: 'מחלקת פריט (<li>)'
      placeholder: 'לדוגמה nav-item'
    class_link:
      label: 'מחלקת קישור (<a>)'
      placeholder: 'לדוגמה nav-link'
    class_children:
      label: 'מחלקת צאצאים (<ul> מקונן)'
      placeholder: 'לדוגמה nav flex-column ms-2'
    class_section_children:
      label: 'מחלקת צאצאי מקטע (<ul> תחת itemType "section")'
      placeholder: 'לדוגמה nav flex-column list-unstyled ps-0 (שטוח; ריק = כמו בצאצאים)'
      help: 'כאשר מוגדר, הרשימה ברמה הראשונה תחת כל מקטע משתמשת במחלקות אלה במקום ב"מחלקת צאצאים", כך שהקישורים יכולים להתיישר עם כותרת המקטע (ללא הזחה). השאירו ריק כדי להמשיך להשתמש במחלקת הצאצאים המקוננים.'
    class_section_child_item:
      label: 'מחלקת <li> לצאצאים ישירים של itemType "section"'
      placeholder: 'לדוגמה nav-item ms-0 (ריק = כמו מחלקת פריט)'
      help: 'כאשר מוגדר, קישורים ומפרידים שהם צאצאים ישירים של מקטע משתמשים בערך זה כמחלקת ה-<li> במקום ב"מחלקת פריט". השתמשו בזה לכוונון שוליים וריפוד ברשימות מקטעים שטוחות.'
    class_section_child_link:
      label: 'מחלקת <a> לצאצאים ישירים של itemType "section"'
      placeholder: 'לדוגמה d-flex align-items-center ps-0 (ריק = כמו מחלקת קישור)'
      help: 'כאשר מוגדר, קישורים שהם צאצאים ישירים של מקטע משתמשים בערך זה כמחלקת ה-<a> במקום ב"מחלקת קישור". פועל יחד עם ה-<li> של צאצא המקטע לצורך יישור.'
    class_section_label:
      label: 'מחלקת תווית מקטע (itemType "section")'
      placeholder: 'לדוגמה navigation-header'
    class_section:
      label: 'מחלקת מקטע (<li> כאשר itemType "section")'
      placeholder: 'לדוגמה menu-section'
    class_divider:
      label: 'מחלקת מפריד (<li> כאשר itemType "divider")'
      placeholder: 'לדוגמה menu-divider'
    class_current:
      label: 'מחלקת פריט נוכחי (קישור התואם לנתיב הנוכחי)'
      placeholder: 'לדוגמה active'
    class_branch_expanded:
      label: 'מחלקת ענף פתוח (<li> כאשר הנתיב נמצא בענף)'
      placeholder: 'לדוגמה active-branch'
    class_has_children:
      label: 'מחלקת בעל צאצאים (<li> כאשר לפריט יש צאצאים)'
      placeholder: 'לדוגמה has-children'
    class_expanded:
      label: 'מחלקת פתוח (<li> כאשר בלוק הצאצאים פתוח)'
      placeholder: 'לדוגמה is-expanded'
    class_collapsed:
      label: 'מחלקת מקופל (<li> כאשר בלוק הצאצאים סגור)'
      placeholder: 'לדוגמה is-collapsed'
    empty_choice: '— ריק —'
    css_section_heading: 'מחלקות CSS לתצוגה (גוברות על ההגדרות כאשר הן מוגדרות).'
    section_definition: 'הגדרה (קוד, בסיס, שם, הקשר, סמל)'
    section_config: 'הגדרות (הרשאות, עומק, קיפול, CSS)'

