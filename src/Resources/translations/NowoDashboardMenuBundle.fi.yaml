# Form: MenuType
form:
  menu_type:
    code:
      label: 'Koodi'
      help: 'Yksilöllinen tunniste (kirjaimet, numerot, _ -). Perusvalikoiden koodia ei voi muuttaa luomisen jälkeen.'
      placeholder: 'esim. sidebar'
    base:
      label: 'Perusvalikko'
      help: 'Kun valittu, tämän valikon koodia ei voi muuttaa luomisen jälkeen.'
    name:
      label: 'Nimi'
      placeholder: 'esim. Sivupalkki'
    context:
      label: 'Konteksti'
      help: 'Valinnaiset JSON-avain–arvo-parit tämän valikkoversion tunnistamiseen. Koodin perusteella haettaessa käytetään ensimmäistä täsmäävää valikkoa järjestetyistä kontekstijoukoista; tyhjä = kyseisen koodin oletusvaihtoehto.'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'Kuvake'
      help: 'Valinnainen kuvakkeen tunniste (esim. Symfony UX Icons: heroicons:home, bootstrap:house).'
      placeholder: 'esim. heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: 'Käyttöoikeuksien tarkistin'
      placeholder: '— Salli kaikki —'
      allow_all: '— Salli kaikki —'
      permission_key_aware: '— Käyttöoikeusavaimen mukaan (rakenne) —'
      help: 'Palvelu, joka toteuttaa rajapinnan MenuPermissionCheckerInterface (tyhjä = salli kaikki).'
    depth_limit:
      label: 'Syvyysraja'
      placeholder: 'tyhjä = rajoittamaton'
      help: 'Näytettävä enimmäissyvyys (1 = vain juuri, 2 = juuri + yksi taso; tyhjä = rajoittamaton).'
    collapsible:
      label: 'Kutistettava (valikko kääritään avattavaan lohkoon)'
    collapsible_expanded:
      label: 'Kutistettava, laajennettu (oletuksena auki)'
    nested_collapsible:
      label: 'Sisäkkäin kutistettava (alakohteellisilla kohteilla on avaus/sulku)'
    nested_collapsible_sections:
      label: 'Kutistettavat osiot'
      help: 'Edellyttää sisäkkäistä kutistusta. Kun käytössä, osiorivien oikealla puolella näkyy nuoli ja niiden linkit voi kutistaa. Kun pois käytöstä, osioiden alakohteet ovat aina laajennettuina (ei nuolta).'
    class_menu:
      label: 'Valikon luokka (juuri-<ul>)'
      placeholder: 'esim. nav flex-column'
    ul_id:
      label: 'Ul-elementin id (juuri-<ul>)'
      placeholder: 'esim. main-menu-navigation'
    class_item:
      label: 'Kohteen luokka (<li>)'
      placeholder: 'esim. nav-item'
    class_link:
      label: 'Linkin luokka (<a>)'
      placeholder: 'esim. nav-link'
    class_children:
      label: 'Alakohteiden luokka (sisäkkäinen <ul>)'
      placeholder: 'esim. nav flex-column ms-2'
    class_section_children:
      label: 'Osion alakohteiden luokka (<ul> itemType "section" -kohteen alla)'
      placeholder: 'esim. nav flex-column list-unstyled ps-0 (tasainen; tyhjä = sama kuin alakohteilla)'
      help: 'Kun asetettu, kunkin osion alla oleva ensimmäisen tason luettelo käyttää näitä luokkia ”Alakohteiden luokan” sijaan, jotta linkit voivat tasautua osion otsikon kanssa (ei sisennystä). Jätä tyhjäksi, jos haluat käyttää edelleen sisäkkäisten alakohteiden luokkaa.'
    class_section_child_item:
      label: '<li>-luokka itemType "section" -kohteen suorille alakohteille'
      placeholder: 'esim. nav-item ms-0 (tyhjä = sama kuin Kohteen luokka)'
      help: 'Kun asetettu, osion suorina alakohteina olevat linkit ja erottimet käyttävät tätä <li>-luokkana ”Kohteen luokan” sijaan. Käytä marginaalien ja täytteiden hienosäätöön tasaisissa osioluetteloissa.'
    class_section_child_link:
      label: '<a>-luokka itemType "section" -kohteen suorille alakohteille'
      placeholder: 'esim. d-flex align-items-center ps-0 (tyhjä = sama kuin Linkin luokka)'
      help: 'Kun asetettu, osion suorina alakohteina olevat linkit käyttävät tätä <a>-luokkana ”Linkin luokan” sijaan. Toimii yhdessä osion alakohteen <li>-luokan kanssa tasausta varten.'
    class_section_label:
      label: 'Osion nimikkeen luokka (itemType "section")'
      placeholder: 'esim. navigation-header'
    class_section:
      label: 'Osion luokka (<li>, kun itemType "section")'
      placeholder: 'esim. menu-section'
    class_divider:
      label: 'Erottimen luokka (<li>, kun itemType "divider")'
      placeholder: 'esim. menu-divider'
    class_current:
      label: 'Nykyisen luokka (nykyistä reittiä vastaava linkki)'
      placeholder: 'esim. active'
    class_branch_expanded:
      label: 'Laajennetun haaran luokka (<li>, kun reitti on haarassa)'
      placeholder: 'esim. active-branch'
    class_has_children:
      label: 'Alakohteellisen luokka (<li>, kun kohteella on alakohteita)'
      placeholder: 'esim. has-children'
    class_expanded:
      label: 'Laajennetun luokka (<li>, kun alakohdelohko on auki)'
      placeholder: 'esim. is-expanded'
    class_collapsed:
      label: 'Kutistetun luokka (<li>, kun alakohdelohko on kiinni)'
      placeholder: 'esim. is-collapsed'
    empty_choice: '— Tyhjä —'
    css_section_heading: 'Hahmonnuksen CSS-luokat (ohittavat asetukset, kun määritetty).'
    section_definition: 'Määrittely (koodi, perus, nimi, konteksti, kuvake)'
    section_config: 'Asetukset (käyttöoikeudet, syvyys, kutistettavuus, CSS)'

  menu_item_type:
    section_basic: 'Tunnistetiedot (nimikkeet)'
    section_icon: 'Tunnistetiedot (tyyppi, sijainti, kuvake)'
    section_config: 'Asetukset (linkki, käyttöoikeus)'
    label_required: 'Nimike on pakollinen linkille ja osiolle.'
    label:
      label: 'Nimike'
    label_locale: 'Nimike (%locale%)'
    divider_label_hint: 'Valinnainen nimi tälle erottimelle (suositellaan saavutettavuuden ja hallintanäkymän luettelon vuoksi). Jätä tyhjäksi, jos tarvitset vain visuaalisen erottimen.'
    type:
      label: 'Tyyppi'
      link: 'Linkki'
      section: 'Osio'
      divider: 'Erotin'
      service: 'Palvelu (ajonaikainen URL)'
    link_resolver:
      label: 'Linkin selvittäjä'
      placeholder: '— Valitse selvittäjä —'
      help: 'Valitse palvelu, joka toteuttaa rajapinnan MenuLinkResolverInterface. Se voi palauttaa yksittäisen URL-osoitteen tai luettelon alalinkkirivejä (label, href, position); yläkohteen href on tällöin "#".'
      service_id_placeholder: 'esim. App\Menu\MyLinkResolver'
      help_free_text: 'Anna palvelun tunniste (luokan nimi tai containerin id), joka toteuttaa rajapinnan MenuLinkResolverInterface.'
      required: 'Kohdetyyppi ”Palvelu” edellyttää linkin selvittäjää.'
      route_params_hint: 'Valinnainen JSON, joka välitetään selvittäjälle (esimerkiksi reittiparametrien kaltaiset arvot).'
    position:
      label: 'Sijainti'
    link_type:
      label: 'Linkin tyyppi'
      route: 'Reitti'
      external_url: 'Ulkoinen URL'
    route_name:
      label: 'Reitin nimi'
      placeholder: '— Valitse reitti —'
    route_params:
      label: 'Reitin parametrit (JSON)'
      placeholder: '{}'
    external_url:
      label: 'Ulkoinen URL'
      placeholder: 'https://...'
    target_blank:
      label: 'Avaa uudessa välilehdessä'
    permission_keys:
      label: 'Käyttöoikeusavaimet'
      placeholder: '— Salli kaikki —'
      help_csv: 'Pilkuilla erotetut avaimet (käytetään, kun määritettyjä vaihtoehtoja ei ole saatavilla).'
      choice:
        authenticated: 'Vain kirjautuneet'
        admin: 'Vain ylläpitäjät'
        path__: 'Polku: / (vain etusivu)'
    is_unanimous:
      label: 'Vaadi kaikki valitut avaimet'
      help: 'Käytössä: kaikkien avainten on täytyttävä (AND). Pois käytöstä: mikä tahansa avain riittää (OR).'
    icon:
      label: 'Kuvake'
      placeholder: 'heroicons:home'
    parent:
      label: 'Yläkohde'
      placeholder: '— Juuri (ei yläkohdetta) —'
      help_inheritance: 'Yläkohteet sijaitsevat puussa tämän kohteen yläpuolella. Tämän rivin käyttöoikeusavaimet koskevat tätä kohdetta; MenuPermissionChecker-toteutuksesi päättää, miten ylä- ja alakohteiden säännöt yhdistetään. Osiot ja laajennettavat linkit näytetään vain, jos vähintään yksi alakohde näkyy.'
      circular_violation: 'Kehämäinen yläkohdehierarkia ei ole sallittu.'
      section_must_be_root: 'Osiokohteiden on pysyttävä juuritasolla (ei yläkohdetta).'
    section_collapsible:
      label: 'Osion alakohteet kutistettavissa'
      inherit: 'Käytä valikon oletusta'
      yes: 'Kyllä (kutistettava nuolella)'
      no: 'Ei (aina laajennettu)'
      help: 'Ohittaa valikon asetuksen ”Kutistettavat osiot” vain tämän osion osalta. ”Käytä valikon oletusta” noudattaa valikon asetuksia.'

  import_menu_type:
    file:
      label: 'JSON-tiedosto'
      required: 'Valitse tiedosto.'
      mime_message: 'Tiedoston on oltava JSON-muotoinen.'
    strategy:
      label: 'Kun valikko, jolla on sama koodi ja konteksti, on jo olemassa'
      skip_existing: 'Ohita (älä tuo)'
      replace: 'Korvaa (poista nykyiset kohteet ja tuo)'

  copy_menu_type:
    code:
      label: 'Koodi'
      placeholder: 'esim. sidebar_copy'
      regex_message: 'Koodi saa sisältää vain kirjaimia, numeroita, alaviivoja ja yhdysmerkkejä.'
    name:
      label: 'Nimi'
      placeholder: 'esim. Sivupalkki (kopio)'
