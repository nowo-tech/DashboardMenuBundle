# Form: MenuType
form:
  menu_type:
    code:
      label: 'รหัส'
      help: 'ตัวระบุที่ไม่ซ้ำกัน (ตัวอักษร ตัวเลข _ -) สำหรับเมนูพื้นฐาน ไม่สามารถเปลี่ยนรหัสได้หลังจากสร้างแล้ว'
      placeholder: 'เช่น sidebar'
    base:
      label: 'เมนูพื้นฐาน'
      help: 'เมื่อเลือกไว้ จะไม่สามารถเปลี่ยนรหัสของเมนูนี้ได้หลังจากสร้างแล้ว'
    name:
      label: 'ชื่อ'
      placeholder: 'เช่น แถบด้านข้าง'
    context:
      label: 'บริบท'
      help: 'คู่คีย์-ค่าแบบ JSON (ไม่บังคับ) เพื่อระบุรูปแบบย่อยของเมนูนี้ เมื่อค้นหาด้วยรหัส ระบบจะใช้เมนูแรกที่ตรงกันตามลำดับชุดบริบท; ว่างไว้ = ค่าสำรองสำหรับรหัสนั้น'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'ไอคอน'
      help: 'ตัวระบุไอคอน (ไม่บังคับ) (เช่น Symfony UX Icons: heroicons:home, bootstrap:house)'
      placeholder: 'เช่น heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: 'ตัวตรวจสอบสิทธิ์'
      placeholder: '— อนุญาตทั้งหมด —'
      allow_all: '— อนุญาตทั้งหมด —'
      permission_key_aware: '— ตามคีย์สิทธิ์ (โครงสร้าง) —'
      help: 'เซอร์วิสที่อิมพลีเมนต์ MenuPermissionCheckerInterface (ว่างไว้ = อนุญาตทั้งหมด)'
    depth_limit:
      label: 'ขีดจำกัดความลึก'
      placeholder: 'ว่างไว้ = ไม่จำกัด'
      help: 'ความลึกสูงสุดที่จะแสดงผล (1 = เฉพาะราก, 2 = ราก + หนึ่งระดับ; ว่างไว้ = ไม่จำกัด)'
    collapsible:
      label: 'ยุบได้ (ครอบเมนูไว้ในบล็อกสลับ)'
    collapsible_expanded:
      label: 'ยุบได้ (เปิดไว้เป็นค่าเริ่มต้น)'
    nested_collapsible:
      label: 'ยุบได้แบบซ้อน (รายการที่มีรายการลูกจะมีปุ่มสลับ)'
    nested_collapsible_sections:
      label: 'ส่วนที่ยุบได้'
      help: 'ต้องเปิดใช้ยุบได้แบบซ้อน เมื่อเปิดใช้ แถวของส่วนจะแสดงลูกศรทางด้านขวาและสามารถยุบลิงก์ได้ เมื่อปิดใช้ รายการลูกของส่วนจะขยายอยู่เสมอ (ไม่มีลูกศร)'
    class_menu:
      label: 'คลาสเมนู (<ul> ระดับราก)'
      placeholder: 'เช่น nav flex-column'
    ul_id:
      label: 'ID ของ ul (<ul> ระดับราก)'
      placeholder: 'เช่น main-menu-navigation'
    class_item:
      label: 'คลาสรายการ (<li>)'
      placeholder: 'เช่น nav-item'
    class_link:
      label: 'คลาสลิงก์ (<a>)'
      placeholder: 'เช่น nav-link'
    class_children:
      label: 'คลาสรายการลูก (<ul> ที่ซ้อน)'
      placeholder: 'เช่น nav flex-column ms-2'
    class_section_children:
      label: 'คลาสรายการลูกของส่วน (<ul> ใต้ itemType "section")'
      placeholder: 'เช่น nav flex-column list-unstyled ps-0 (แบบแบน; ว่างไว้ = เหมือนรายการลูก)'
      help: 'เมื่อตั้งค่าไว้ รายการระดับแรกใต้แต่ละส่วนจะใช้คลาสเหล่านี้แทน “คลาสรายการลูก” เพื่อให้ลิงก์จัดแนวตรงกับหัวข้อของส่วน (ไม่เยื้อง) เว้นว่างไว้เพื่อใช้คลาสรายการลูกแบบซ้อนต่อไป'
    class_section_child_item:
      label: 'คลาส <li> สำหรับรายการลูกโดยตรงของ itemType "section"'
      placeholder: 'เช่น nav-item ms-0 (ว่างไว้ = เหมือนคลาสรายการ)'
      help: 'เมื่อตั้งค่าไว้ ลิงก์และเส้นแบ่งที่เป็นรายการลูกโดยตรงของส่วนจะใช้ค่านี้เป็นคลาสของ <li> แทน “คลาสรายการ” ใช้สำหรับปรับ margin/padding ในรายการแบบแบนของส่วน'
