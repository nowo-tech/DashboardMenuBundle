      help: 'เมื่อตั้งค่าไว้ ลิงก์ที่เป็นรายการลูกโดยตรงของส่วนจะใช้ค่านี้เป็นคลาสของ <a> แทน “คลาสลิงก์” ใช้คู่กับ <li> ของรายการลูกในส่วนเพื่อการจัดแนว'
