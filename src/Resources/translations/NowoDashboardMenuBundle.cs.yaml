# Form: MenuType
form:
  menu_type:
    code:
      label: 'Kód'
      help: 'Jedinečný identifikátor (písmena, číslice, _ -). U základních menu nelze kód po vytvoření změnit.'
      placeholder: 'např. sidebar'
    base:
      label: 'Základní menu'
      help: 'Je-li zaškrtnuto, kód tohoto menu nelze po vytvoření změnit.'
    name:
      label: 'Název'
      placeholder: 'např. Postranní panel'
    context:
      label: 'Kontext'
      help: 'Volitelné páry klíč–hodnota v JSON pro identifikaci této varianty menu. Při vyhledávání podle kódu se použije první odpovídající menu v seřazených sadách kontextu; prázdné = výchozí varianta pro daný kód.'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'Ikona'
      help: 'Volitelný identifikátor ikony (např. Symfony UX Icons: heroicons:home, bootstrap:house).'
      placeholder: 'např. heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: 'Kontrola oprávnění'
      placeholder: '— Povolit vše —'
      allow_all: '— Povolit vše —'
      permission_key_aware: '— Podle klíče oprávnění (struktura) —'
      help: 'Služba implementující MenuPermissionCheckerInterface (prázdné = povolit vše).'
    depth_limit:
      label: 'Limit hloubky'
      placeholder: 'prázdné = bez omezení'
      help: 'Maximální hloubka vykreslení (1 = pouze kořen, 2 = kořen + jedna úroveň; prázdné = bez omezení).'
    collapsible:
      label: 'Sbalitelné (obalit menu do přepínacího bloku)'
    collapsible_expanded:
      label: 'Sbalitelné rozbalené (ve výchozím stavu otevřené)'
    nested_collapsible:
      label: 'Vnořené sbalitelné (položky s podřízenými mají přepínač)'
    nested_collapsible_sections:
      label: 'Sbalitelné sekce'
      help: 'Vyžaduje vnořené sbalování. Je-li zapnuto, řádky sekcí zobrazují vpravo šipku a jejich odkazy lze sbalit. Je-li vypnuto, podřízené položky sekcí zůstávají vždy rozbalené (bez šipky).'
    class_menu:
      label: 'Třída menu (kořenový <ul>)'
      placeholder: 'např. nav flex-column'
    ul_id:
      label: 'Id ul (kořenový <ul>)'
      placeholder: 'např. main-menu-navigation'
    class_item:
      label: 'Třída položky (<li>)'
      placeholder: 'např. nav-item'
    class_link:
      label: 'Třída odkazu (<a>)'
      placeholder: 'např. nav-link'
    class_children:
      label: 'Třída podřízených (vnořený <ul>)'
      placeholder: 'např. nav flex-column ms-2'
    class_section_children:
      label: 'Třída podřízených sekce (<ul> pod itemType "section")'
      placeholder: 'např. nav flex-column list-unstyled ps-0 (plochý; prázdné = stejné jako podřízené)'
      help: 'Je-li nastaveno, seznam první úrovně pod každou sekcí použije tyto třídy místo „Třída podřízených“, takže se odkazy mohou zarovnat s nadpisem sekce (bez odsazení). Ponechte prázdné, chcete-li dále používat třídu vnořených podřízených.'
    class_section_child_item:
      label: 'Třída <li> pro přímé potomky itemType "section"'
      placeholder: 'např. nav-item ms-0 (prázdné = stejné jako Třída položky)'
      help: 'Je-li nastaveno, odkazy a oddělovače, které jsou přímými potomky sekce, použijí tuto hodnotu jako třídu <li> místo „Třída položky“. Slouží k úpravám okrajů/odsazení pod plochými seznamy sekcí.'
    class_section_child_link:
      label: 'Třída <a> pro přímé potomky itemType "section"'
      placeholder: 'např. d-flex align-items-center ps-0 (prázdné = stejné jako Třída odkazu)'
      help: 'Je-li nastaveno, odkazy, které jsou přímými potomky sekce, použijí tuto hodnotu jako třídu <a> místo „Třída odkazu“. Kombinuje se s třídou <li> potomků sekce pro zarovnání.'
    class_section_label:
      label: 'Třída popisku sekce (itemType "section")'
      placeholder: 'např. navigation-header'
    class_section:
      label: 'Třída sekce (<li> při itemType "section")'
      placeholder: 'např. menu-section'
    class_divider:
      label: 'Třída oddělovače (<li> při itemType "divider")'
      placeholder: 'např. menu-divider'
    class_current:
      label: 'Třída aktuální položky (odkaz odpovídající aktuální routě)'
      placeholder: 'např. active'
    class_branch_expanded:
      label: 'Třída rozbalené větve (<li>, když je routa ve větvi)'
      placeholder: 'např. active-branch'
    class_has_children:
      label: 'Třída s podřízenými (<li>, když má položka podřízené)'
      placeholder: 'např. has-children'
    class_expanded:
      label: 'Třída rozbaleno (<li>, když je blok podřízených otevřený)'
      placeholder: 'např. is-expanded'
    class_collapsed:
      label: 'Třída sbaleno (<li>, když je blok podřízených zavřený)'
      placeholder: 'např. is-collapsed'
    empty_choice: '— Prázdné —'
    css_section_heading: 'Třídy CSS pro vykreslení (pokud jsou nastaveny, přepisují konfiguraci).'
    section_definition: 'Definice (kód, základní, název, kontext, ikona)'
    section_config: 'Konfigurace (oprávnění, hloubka, sbalování, CSS)'

  menu_item_type:
    section_basic: 'Identita (popisky)'
    section_icon: 'Identita (typ, pozice, ikona)'
    section_config: 'Konfigurace (odkaz, oprávnění)'
    label_required: 'Popisek je povinný pro Odkaz a Sekci.'
    label:
      label: 'Popisek'
    label_locale: 'Popisek (%locale%)'
    labels_by_locale: 'Popisek podle jazyka'
    divider_label_hint: 'Volitelný název tohoto oddělovače (doporučeno kvůli přístupnosti a seznamu ve správě). Ponechte prázdné, pokud potřebujete jen vizuální oddělovač.'
    type:
      label: 'Typ'
      link: 'Odkaz'
      section: 'Sekce'
      divider: 'Oddělovač'
      service: 'Služba (URL za běhu)'
    link_resolver:
      label: 'Resolver odkazů'
      placeholder: '— Vyberte resolver —'
      help: 'Vyberte službu, která implementuje MenuLinkResolverInterface. Může vrátit jednu URL nebo seznam řádků podřízených odkazů (popisek, href, pozice); href nadřazené položky je pak "#".'
      service_id_placeholder: 'např. App\Menu\MyLinkResolver'
      help_free_text: 'Zadejte id služby (název třídy nebo id v kontejneru), která implementuje MenuLinkResolverInterface.'
      required: 'Pro typ položky „Služba“ je resolver odkazů povinný.'
      route_params_hint: 'Volitelný JSON předaný resolveru (například parametry podobné parametrům routy).'
    position:
      label: 'Pozice'
    link_type:
      label: 'Typ odkazu'
      route: 'Routa'
      external_url: 'Externí URL'
    route_name:
      label: 'Název routy'
      placeholder: '— Vyberte routu —'
    route_params:
      label: 'Parametry routy (JSON)'
      placeholder: '{}'
    external_url:
      label: 'Externí URL'
      placeholder: 'https://...'
    target_blank:
      label: 'Otevřít v nové kartě'
    permission_keys:
      label: 'Klíče oprávnění'
      placeholder: '— Povolit vše —'
      help_csv: 'Klíče oddělené čárkami (použijí se, pokud nejsou k dispozici nakonfigurované volby).'
      choice:
        authenticated: 'Pouze přihlášení'
        admin: 'Pouze administrátoři'
        path__: 'Cesta: / (pouze úvodní stránka)'
    is_unanimous:
      label: 'Vyžadovat všechny vybrané klíče'
      help: 'Zapnuto: musí projít všechny klíče (AND). Vypnuto: stačí jakýkoli klíč (OR).'
    icon:
      label: 'Ikona'
      placeholder: 'heroicons:home'
    parent:
      label: 'Nadřazená položka'
      placeholder: '— Kořen (bez nadřazené položky) —'
      help_inheritance: 'Nadřazené položky jsou ve stromu nad touto položkou. Klíče oprávnění v tomto řádku platí pro tuto položku; váš MenuPermissionChecker rozhoduje, jak se kombinují pravidla nadřazených a podřízených položek. Sekce a rozbalovací odkazy se vykreslí, jen pokud je zobrazena alespoň jedna podřízená položka.'
      circular_violation: 'Cyklická hierarchie nadřazených položek není povolena.'
      section_must_be_root: 'Položky sekcí musí zůstat na kořenové úrovni (bez nadřazené položky).'
    section_collapsible:
      label: 'Sbalitelné podřízené položky sekce'
      inherit: 'Použít výchozí nastavení menu'
      yes: 'Ano (sbalitelné se šipkou)'
      no: 'Ne (vždy rozbalené)'
      help: 'Přepíše volbu menu „Sbalitelné sekce“ pouze pro tuto sekci. „Použít výchozí nastavení menu“ se řídí konfigurací menu.'

  import_menu_type:
    file:
      label: 'Soubor JSON'
      required: 'Vyberte prosím soubor.'
      mime_message: 'Soubor musí být ve formátu JSON.'
    strategy:
      label: 'Pokud menu se stejným kódem a kontextem již existuje'
      skip_existing: 'Přeskočit (neimportovat)'
      replace: 'Nahradit (smazat existující položky a importovat)'

  copy_menu_type:
    code:
      label: 'Kód'
      placeholder: 'např. sidebar_copy'
      regex_message: 'Kód smí obsahovat pouze písmena, číslice, podtržítko a pomlčku.'
    name:
      label: 'Název'
      placeholder: 'např. Postranní panel (kopie)'
