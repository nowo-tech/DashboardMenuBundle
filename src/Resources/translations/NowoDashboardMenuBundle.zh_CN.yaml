# Form: MenuType
form:
  menu_type:
    code:
      label: '代码'
      help: '唯一标识符（字母、数字、_ -）。基础菜单的代码在创建后无法更改。'
      placeholder: '例如 sidebar'
    base:
      label: '基础菜单'
      help: '勾选后，此菜单的代码在创建后将无法更改。'
    name:
      label: '名称'
      placeholder: '例如 侧边栏'
    context:
      label: '上下文'
      help: '可选的 JSON 键值对，用于标识此菜单变体。按代码解析时，将使用有序上下文集合中第一个匹配的菜单；留空 = 该代码的后备菜单。'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: '图标'
      help: '可选的图标标识符（例如 Symfony UX Icons：heroicons:home、bootstrap:house）。'
      placeholder: '例如 heroicons:bars-3、bootstrap:list'
    permission_checker:
      label: '权限检查器'
      placeholder: '— 允许全部 —'
      allow_all: '— 允许全部 —'
      permission_key_aware: '— 按权限键（结构）—'
      help: '实现 MenuPermissionCheckerInterface 的服务（留空 = 允许全部）。'
    depth_limit:
      label: '深度限制'
      placeholder: '留空 = 无限制'
      help: '渲染的最大深度（1 = 仅根级，2 = 根级 + 一层；留空 = 无限制）。'
    collapsible:
      label: '可折叠（将菜单包裹在切换块中）'
    collapsible_expanded:
      label: '可折叠且展开（默认打开）'
    nested_collapsible:
      label: '嵌套可折叠（有子项的菜单项带切换按钮）'
    nested_collapsible_sections:
      label: '可折叠分区'
      help: '需要启用嵌套可折叠。启用后，分区行右侧会显示箭头，其链接可以折叠。禁用后，分区子项始终展开（无箭头）。'
    class_menu:
      label: '菜单类（根 <ul>）'
      placeholder: '例如 nav flex-column'
    ul_id:
      label: 'Ul ID（根 <ul>）'
      placeholder: '例如 main-menu-navigation'
    class_item:
      label: '菜单项类（<li>）'
      placeholder: '例如 nav-item'
    class_link:
      label: '链接类（<a>）'
      placeholder: '例如 nav-link'
    class_children:
      label: '子级类（嵌套 <ul>）'
      placeholder: '例如 nav flex-column ms-2'
    class_section_children:
      label: '分区子级类（itemType "section" 下的 <ul>）'
      placeholder: '例如 nav flex-column list-unstyled ps-0（扁平；留空 = 与子级类相同）'
      help: '设置后，每个分区下的第一层列表将使用这些类而非“子级类”，使链接可以与分区标题对齐（无缩进）。留空则继续使用嵌套子级类。'
    class_section_child_item:
      label: 'itemType "section" 直接子项的 <li> 类'
      placeholder: '例如 nav-item ms-0（留空 = 与菜单项类相同）'
      help: '设置后，作为分区直接子项的链接和分隔线将使用此值作为 <li> 类，而非“菜单项类”。可用于调整扁平分区列表下的外边距/内边距。'
    class_section_child_link:
      label: 'itemType "section" 直接子项的 <a> 类'
      placeholder: '例如 d-flex align-items-center ps-0（留空 = 与链接类相同）'
      help: '设置后，作为分区直接子项的链接将使用此值作为 <a> 类，而非“链接类”。与分区子项 <li> 类配合使用以实现对齐。'
    class_section_label:
      label: '分区标签类（itemType "section"）'
      placeholder: '例如 navigation-header'
    class_section:
      label: '分区类（itemType "section" 时的 <li>）'
      placeholder: '例如 menu-section'
    class_divider:
      label: '分隔线类（itemType "divider" 时的 <li>）'
      placeholder: '例如 menu-divider'
    class_current:
      label: '当前项类（与当前路由匹配的链接）'
      placeholder: '例如 active'
    class_branch_expanded:
      label: '分支展开类（路由位于分支内时的 <li>）'
      placeholder: '例如 active-branch'
    class_has_children:
      label: '含子项类（菜单项有子项时的 <li>）'
      placeholder: '例如 has-children'
    class_expanded:
      label: '展开类（子项块打开时的 <li>）'
      placeholder: '例如 is-expanded'
    class_collapsed:
      label: '折叠类（子项块关闭时的 <li>）'
      placeholder: '例如 is-collapsed'
    empty_choice: '— 空 —'
    css_section_heading: '用于渲染的 CSS 类（设置后将覆盖配置）。'
    section_definition: '定义（代码、基础、名称、上下文、图标）'
    section_config: '配置（权限、深度、可折叠、CSS）'

  menu_item_type:
    section_basic: '标识（标签）'
    section_icon: '标识（类型、位置、图标）'
    section_config: '配置（链接、权限）'
    label_required: '链接和分区必须填写标签。'
    label:
      label: '标签'
    label_locale: '标签（%locale%）'
    divider_label_hint: '此分隔线的可选名称（建议填写，以提升无障碍性并便于在管理面板列表中识别）。如果只需要视觉分隔，请留空。'
    type:
      label: '类型'
      link: '链接'
      section: '分区'
      divider: '分隔线'
      service: '服务（运行时 URL）'
    link_resolver:
      label: '链接解析器'
      placeholder: '— 选择解析器 —'
      help: '选择一个实现 MenuLinkResolverInterface 的服务。它可以返回单个 URL，或子链接行列表（label、href、position）；此时父级的 href 为 "#"。'
      service_id_placeholder: '例如 App\Menu\MyLinkResolver'
      help_free_text: '输入实现 MenuLinkResolverInterface 的服务 ID（类名或容器 ID）。'
      required: '菜单项类型为“服务”时必须指定链接解析器。'
      route_params_hint: '传递给解析器的可选 JSON（例如类似路由的参数）。'
    position:
      label: '位置'
    link_type:
      label: '链接类型'
      route: '路由'
      external_url: '外部 URL'
    route_name:
      label: '路由名称'
      placeholder: '— 选择路由 —'
    route_params:
      label: '路由参数（JSON）'
      placeholder: '{}'
    external_url:
      label: '外部 URL'
      placeholder: 'https://...'
    target_blank:
      label: '在新标签页中打开'
    permission_keys:
      label: '权限键'
      placeholder: '— 允许全部 —'
      help_csv: '以逗号分隔的键（在没有可用的配置选项时使用）。'
      choice:
        authenticated: '仅限已登录用户'
        admin: '仅限管理员'
        path__: '路径：/（仅首页）'
    is_unanimous:
      label: '要求满足所有选定的键'
      help: '启用：所有键都必须通过（AND）。禁用：任一键通过即可（OR）。'
    icon:
      label: '图标'
      placeholder: 'heroicons:home'
    parent:
      label: '父级'
      placeholder: '— 根级（无父级）—'
      help_inheritance: '父级菜单项在树中位于此项之上。此行上的权限键作用于此菜单项；父级/子级规则如何组合由您的 MenuPermissionChecker 决定。分区和可展开链接仅在至少显示一个子项时才会渲染。'
      circular_violation: '不允许循环的父级层次结构。'
      section_must_be_root: '分区项必须保持在根级别（无父级）。'
    section_collapsible:
      label: '分区子项可折叠'
      inherit: '使用菜单默认设置'
      yes: '是（可折叠，带箭头）'
      no: '否（始终展开）'
      help: '仅针对此分区覆盖菜单选项“可折叠分区”。“使用菜单默认设置”将遵循菜单配置。'

  import_menu_type:
    file:
      label: 'JSON 文件'
      required: '请选择一个文件。'
      mime_message: '文件必须为 JSON 格式。'
    strategy:
      label: '当已存在具有相同代码和上下文的菜单时'
      skip_existing: '跳过（不导入）'
      replace: '替换（删除现有菜单项后导入）'

  copy_menu_type:
    code:
      label: '代码'
      placeholder: '例如 sidebar_copy'
      regex_message: '代码只能包含字母、数字、下划线和连字符。'
    name:
      label: '名称'
      placeholder: '例如 侧边栏（副本）'
