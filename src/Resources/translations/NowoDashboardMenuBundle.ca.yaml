# Form: MenuType
form:
  menu_type:
    code:
      label: 'Codi'
      help: 'Identificador únic (lletres, números, _ -). En els menús base, el codi no es pot canviar després de crear-lo.'
      placeholder: 'p. ex. sidebar'
    base:
      label: 'Menú base'
      help: 'Si està marcat, el codi d''aquest menú no es pot canviar després de crear-lo.'
    name:
      label: 'Nom'
      placeholder: 'p. ex. Barra lateral'
    context:
      label: 'Context'
      help: 'Parells clau-valor JSON opcionals per identificar aquesta variant del menú. En resoldre per codi, s''utilitza el primer menú coincident dels conjunts de context ordenats; buit = menú per defecte per a aquest codi.'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'Icona'
      help: 'Identificador d''icona opcional (p. ex. Symfony UX Icons: heroicons:home, bootstrap:house).'
      placeholder: 'p. ex. heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: 'Verificador de permisos'
      placeholder: '— Permet-ho tot —'
      allow_all: '— Permet-ho tot —'
      permission_key_aware: '— Per clau de permís (estructura) —'
      help: 'Servei que implementa MenuPermissionCheckerInterface (buit = permet-ho tot).'
    depth_limit:
      label: 'Límit de profunditat'
      placeholder: 'buit = il·limitat'
      help: 'Profunditat màxima a renderitzar (1 = només arrel, 2 = arrel + un nivell; buit = il·limitat).'
    collapsible:
      label: 'Plegable (embolcalla el menú en un bloc commutable)'
    collapsible_expanded:
      label: 'Plegable desplegat (obert per defecte)'
    nested_collapsible:
      label: 'Plegable niat (els elements amb fills tenen commutador)'
    nested_collapsible_sections:
      label: 'Seccions plegables'
      help: 'Requereix el plegable niat. Si està activat, les files de secció mostren una fletxa a la dreta i els seus enllaços es poden plegar. Si està desactivat, els fills de la secció es mantenen sempre desplegats (sense fletxa).'
    class_menu:
      label: 'Classe del menú (<ul> arrel)'
      placeholder: 'p. ex. nav flex-column'
    ul_id:
      label: 'Id de l''ul (<ul> arrel)'
      placeholder: 'p. ex. main-menu-navigation'
    class_item:
      label: 'Classe de l''element (<li>)'
      placeholder: 'p. ex. nav-item'
    class_link:
      label: 'Classe de l''enllaç (<a>)'
      placeholder: 'p. ex. nav-link'
    class_children:
      label: 'Classe dels fills (<ul> niat)'
      placeholder: 'p. ex. nav flex-column ms-2'
    class_section_children:
      label: 'Classe dels fills de secció (<ul> sota itemType "section")'
      placeholder: 'p. ex. nav flex-column list-unstyled ps-0 (pla; buit = igual que els fills)'
      help: 'Si s''estableix, la llista de primer nivell sota cada secció utilitza aquestes classes en lloc de «Classe dels fills», de manera que els enllaços s''alineïn amb el títol de la secció (sense sagnat). Deixa-ho buit per continuar fent servir la classe dels fills niats.'
    class_section_child_item:
      label: 'Classe <li> per als fills directes d''itemType "section"'
      placeholder: 'p. ex. nav-item ms-0 (buit = igual que la classe de l''element)'
      help: 'Si s''estableix, els enllaços i separadors que són fills directes d''una secció utilitzen aquest valor com a classe del <li> en lloc de «Classe de l''element». Útil per ajustar marges/farciment sota llistes de secció planes.'
    class_section_child_link:
      label: 'Classe <a> per als fills directes d''itemType "section"'
      placeholder: 'p. ex. d-flex align-items-center ps-0 (buit = igual que la classe de l''enllaç)'
      help: 'Si s''estableix, els enllaços que són fills directes d''una secció utilitzen aquest valor com a classe de l''<a> en lloc de «Classe de l''enllaç». Es combina amb el <li> dels fills de secció per a l''alineació.'
    class_section_label:
      label: 'Classe de l''etiqueta de secció (itemType "section")'
      placeholder: 'p. ex. navigation-header'
    class_section:
      label: 'Classe de secció (<li> quan itemType és "section")'
      placeholder: 'p. ex. menu-section'
    class_divider:
      label: 'Classe del separador (<li> quan itemType és "divider")'
      placeholder: 'p. ex. menu-divider'
    class_current:
      label: 'Classe actual (enllaç que coincideix amb la ruta actual)'
      placeholder: 'p. ex. active'
    class_branch_expanded:
      label: 'Classe de branca desplegada (<li> quan la ruta és dins la branca)'
      placeholder: 'p. ex. active-branch'
    class_has_children:
      label: 'Classe amb fills (<li> quan l''element té fills)'
      placeholder: 'p. ex. has-children'
    class_expanded:
      label: 'Classe desplegat (<li> quan el bloc de fills és obert)'
      placeholder: 'p. ex. is-expanded'
    class_collapsed:
      label: 'Classe plegat (<li> quan el bloc de fills és tancat)'
      placeholder: 'p. ex. is-collapsed'
    empty_choice: '— Buit —'
    css_section_heading: 'Classes CSS per a la renderització (substitueixen la configuració si s''estableixen).'
    section_definition: 'Definició (codi, base, nom, context, icona)'
    section_config: 'Configuració (permisos, profunditat, plegable, CSS)'

  menu_item_type:
    section_basic: 'Identitat (etiquetes)'
    section_icon: 'Identitat (tipus, posició, icona)'
    section_config: 'Configuració (enllaç, permís)'
    label_required: 'L''etiqueta és obligatòria per a Enllaç i Secció.'
    label:
      label: 'Etiqueta'
    label_locale: 'Etiqueta (%locale%)'
    divider_label_hint: 'Nom opcional per a aquest separador (recomanat per a l''accessibilitat i la llista del tauler). Deixa-ho buit si només necessites un separador visual.'
    type:
      label: 'Tipus'
      link: 'Enllaç'
      section: 'Secció'
      divider: 'Separador'
      service: 'Servei (URL en temps d''execució)'
    link_resolver:
      label: 'Resolutor d''enllaços'
      placeholder: '— Selecciona un resolutor —'
      help: 'Tria un servei que implementi MenuLinkResolverInterface. Pot retornar una sola URL o una llista de files d''enllaços fills (etiqueta, href, posició); llavors el href del pare és "#".'
      service_id_placeholder: 'p. ex. App\Menu\MyLinkResolver'
      help_free_text: 'Introdueix l''id del servei (nom de classe o id del contenidor) que implementa MenuLinkResolverInterface.'
      required: 'Cal un resolutor d''enllaços per al tipus d''element «Servei».'
      route_params_hint: 'JSON opcional que es passa al resolutor (per exemple, paràmetres semblants als d''una ruta).'
    position:
      label: 'Posició'
    link_type:
      label: 'Tipus d''enllaç'
      route: 'Ruta'
      external_url: 'URL externa'
    route_name:
      label: 'Nom de la ruta'
      placeholder: '— Selecciona una ruta —'
    route_params:
      label: 'Paràmetres de la ruta (JSON)'
      placeholder: '{}'
    external_url:
      label: 'URL externa'
      placeholder: 'https://...'
    target_blank:
      label: 'Obre en una pestanya nova'
    permission_keys:
      label: 'Claus de permís'
      placeholder: '— Permet-ho tot —'
      help_csv: 'Claus separades per comes (s''utilitzen quan no hi ha opcions configurades disponibles).'
      choice:
        authenticated: 'Només autenticats'
        admin: 'Només administradors'
        path__: 'Ruta: / (només inici)'
    is_unanimous:
      label: 'Requereix totes les claus seleccionades'
      help: 'Activat: totes les claus han de complir-se (AND). Desactivat: n''hi ha prou que se''n compleixi una (OR).'
    icon:
      label: 'Icona'
      placeholder: 'heroicons:home'
    parent:
      label: 'Pare'
      placeholder: '— Arrel (sense pare) —'
      help_inheritance: 'Els elements pare se situen per sobre d''aquest a l''arbre. Les claus de permís d''aquesta fila s''apliquen a aquest element; el teu MenuPermissionChecker decideix com es combinen les regles de pare i fill. Les seccions i els enllaços desplegables només es mostren quan almenys un fill és visible.'
      circular_violation: 'No es permet una jerarquia de pares circular.'
      section_must_be_root: 'Els elements de secció han de romandre al nivell arrel (sense pare).'
    section_collapsible:
      label: 'Fills de la secció plegables'
      inherit: 'Utilitza el valor per defecte del menú'
      yes: 'Sí (plegable amb fletxa)'
      no: 'No (sempre desplegat)'
      help: 'Substitueix l''opció del menú «Seccions plegables» només per a aquesta secció. «Utilitza el valor per defecte del menú» segueix la configuració del menú.'

  import_menu_type:
    file:
      label: 'Fitxer JSON'
      required: 'Tria un fitxer.'
      mime_message: 'El fitxer ha de ser JSON.'
    strategy:
      label: 'Quan ja existeix un menú amb el mateix codi i context'
      skip_existing: 'Omet (no importis)'
      replace: 'Substitueix (elimina els elements existents i importa)'

  copy_menu_type:
    code:
      label: 'Codi'
      placeholder: 'p. ex. sidebar_copy'
      regex_message: 'El codi només pot contenir lletres, números, guions baixos i guions.'
    name:
      label: 'Nom'
      placeholder: 'p. ex. Barra lateral (còpia)'
