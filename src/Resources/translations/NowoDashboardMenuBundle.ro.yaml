# Form: MenuType
form:
  menu_type:
    code:
      label: 'Cod'
      help: 'Identificator unic (litere, cifre, _ -). Pentru meniurile de bază, codul nu poate fi modificat după creare.'
      placeholder: 'ex. sidebar'
    base:
      label: 'Meniu de bază'
      help: 'Dacă este bifat, codul acestui meniu nu mai poate fi modificat după creare.'
    name:
      label: 'Nume'
      placeholder: 'ex. Bară laterală'
    context:
      label: 'Context'
      help: 'Perechi cheie-valoare JSON opționale pentru identificarea acestei variante de meniu. La rezolvarea după cod se folosește primul meniu corespunzător din seturile de context ordonate; gol = variantă implicită pentru acel cod.'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'Pictogramă'
      help: 'Identificator opțional de pictogramă (ex. Symfony UX Icons: heroicons:home, bootstrap:house).'
      placeholder: 'ex. heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: 'Verificator de permisiuni'
      placeholder: '— Permite tot —'
      allow_all: '— Permite tot —'
      permission_key_aware: '— După cheia de permisiune (structură) —'
      help: 'Serviciu care implementează MenuPermissionCheckerInterface (gol = permite tot).'
    depth_limit:
      label: 'Limită de adâncime'
      placeholder: 'gol = nelimitat'
      help: 'Adâncimea maximă de randare (1 = doar rădăcina, 2 = rădăcina + un nivel; gol = nelimitat).'
    collapsible:
      label: 'Restrângibil (încadrează meniul într-un bloc comutabil)'
    collapsible_expanded:
      label: 'Restrângibil extins (deschis implicit)'
    nested_collapsible:
      label: 'Restrângibil imbricat (elementele cu copii au comutator)'
    nested_collapsible_sections:
      label: 'Secțiuni restrângibile'
      help: 'Necesită „Restrângibil imbricat”. Când este activat, rândurile de secțiune afișează o săgeată în dreapta, iar linkurile lor pot fi restrânse. Când este dezactivat, copiii secțiunii rămân mereu extinși (fără săgeată).'
    class_menu:
      label: 'Clasă meniu (<ul> rădăcină)'
      placeholder: 'ex. nav flex-column'
    ul_id:
      label: 'Id ul (<ul> rădăcină)'
      placeholder: 'ex. main-menu-navigation'
    class_item:
      label: 'Clasă element (<li>)'
      placeholder: 'ex. nav-item'
    class_link:
      label: 'Clasă link (<a>)'
      placeholder: 'ex. nav-link'
    class_children:
      label: 'Clasă copii (<ul> imbricat)'
      placeholder: 'ex. nav flex-column ms-2'
    class_section_children:
      label: 'Clasă copii secțiune (<ul> sub itemType "section")'
      placeholder: 'ex. nav flex-column list-unstyled ps-0 (plat; gol = la fel ca la copii)'
      help: 'Dacă este setată, lista de prim nivel de sub fiecare secțiune folosește aceste clase în loc de „Clasă copii”, astfel încât linkurile să se poată alinia cu titlul secțiunii (fără indentare). Lăsați gol pentru a folosi în continuare clasa copiilor imbricați.'
    class_section_child_item:
      label: 'Clasă <li> pentru copiii direcți ai itemType "section"'
      placeholder: 'ex. nav-item ms-0 (gol = la fel ca Clasă element)'
      help: 'Dacă este setată, linkurile și separatoarele care sunt copii direcți ai unei secțiuni folosesc această clasă pentru <li> în loc de „Clasă element”. Utilă pentru ajustări de margine/spațiere în listele de secțiune plate.'
    class_section_child_link:
      label: 'Clasă <a> pentru copiii direcți ai itemType "section"'
      placeholder: 'ex. d-flex align-items-center ps-0 (gol = la fel ca Clasă link)'
      help: 'Dacă este setată, linkurile care sunt copii direcți ai unei secțiuni folosesc această clasă pentru <a> în loc de „Clasă link”. Se folosește împreună cu clasa <li> a copiilor de secțiune pentru aliniere.'
    class_section_label:
      label: 'Clasă etichetă secțiune (itemType "section")'
      placeholder: 'ex. navigation-header'
    class_section:
      label: 'Clasă secțiune (<li> când itemType "section")'
      placeholder: 'ex. menu-section'
    class_divider:
      label: 'Clasă separator (<li> când itemType "divider")'
      placeholder: 'ex. menu-divider'
    class_current:
      label: 'Clasă curent (link care corespunde rutei curente)'
      placeholder: 'ex. active'
    class_branch_expanded:
      label: 'Clasă ramură extinsă (<li> când ruta este în ramură)'
      placeholder: 'ex. active-branch'
    class_has_children:
      label: 'Clasă are copii (<li> când elementul are copii)'
      placeholder: 'ex. has-children'
    class_expanded:
      label: 'Clasă extins (<li> când blocul de copii este deschis)'
      placeholder: 'ex. is-expanded'
    class_collapsed:
      label: 'Clasă restrâns (<li> când blocul de copii este închis)'
      placeholder: 'ex. is-collapsed'
    empty_choice: '— Gol —'
    css_section_heading: 'Clase CSS pentru randare (suprascriu configurația când sunt setate).'
    section_definition: 'Definiție (cod, de bază, nume, context, pictogramă)'
    section_config: 'Configurație (permisiuni, adâncime, restrângibil, CSS)'

  menu_item_type:
    section_basic: 'Identitate (etichete)'
    section_icon: 'Identitate (tip, poziție, pictogramă)'
    section_config: 'Configurație (link, permisiune)'
    label_required: 'Eticheta este obligatorie pentru Link și Secțiune.'
    label:
      label: 'Etichetă'
    label_locale: 'Etichetă (%locale%)'
    divider_label_hint: 'Nume opțional pentru acest separator (recomandat pentru accesibilitate și pentru lista din panou). Lăsați gol dacă aveți nevoie doar de un separator vizual.'
    type:
      label: 'Tip'
      link: 'Link'
      section: 'Secțiune'
      divider: 'Separator'
      service: 'Serviciu (URL la rulare)'
    link_resolver:
      label: 'Rezolvator de linkuri'
      placeholder: '— Selectați rezolvatorul —'
      help: 'Alegeți un serviciu care implementează MenuLinkResolverInterface. Acesta poate returna un singur URL sau o listă de rânduri de linkuri copil (etichetă, href, poziție); în acest caz, href-ul părintelui este "#".'
      service_id_placeholder: 'ex. App\Menu\MyLinkResolver'
      help_free_text: 'Introduceți id-ul serviciului (numele clasei sau id-ul din container) care implementează MenuLinkResolverInterface.'
      required: 'Pentru tipul de element „Serviciu” este necesar un rezolvator de linkuri.'
      route_params_hint: 'JSON opțional transmis rezolvatorului (de exemplu, parametri similari celor de rută).'
    position:
      label: 'Poziție'
    link_type:
      label: 'Tip de link'
      route: 'Rută'
      external_url: 'URL extern'
    route_name:
      label: 'Numele rutei'
      placeholder: '— Selectați ruta —'
    route_params:
      label: 'Parametrii rutei (JSON)'
      placeholder: '{}'
    external_url:
      label: 'URL extern'
      placeholder: 'https://...'
    target_blank:
      label: 'Deschide într-o filă nouă'
    permission_keys:
      label: 'Chei de permisiune'
      placeholder: '— Permite tot —'
      help_csv: 'Chei separate prin virgulă (folosite când nu sunt disponibile opțiuni configurate).'
      choice:
        authenticated: 'Doar autentificați'
        admin: 'Doar administrator'
        path__: 'Cale: / (doar pagina principală)'
    is_unanimous:
      label: 'Solicită toate cheile selectate'
      help: 'Activat: toate cheile trebuie să fie îndeplinite (AND). Dezactivat: este suficientă oricare cheie (OR).'
    icon:
      label: 'Pictogramă'
      placeholder: 'heroicons:home'
    parent:
      label: 'Părinte'
      placeholder: '— Rădăcină (fără părinte) —'
      help_inheritance: 'Elementele părinte se află deasupra acestuia în arbore. Cheile de permisiune din acest rând se aplică acestui element; MenuPermissionChecker-ul dvs. decide cum se combină regulile părinte/copil. Secțiunile și linkurile extensibile sunt randate doar când este afișat cel puțin un copil.'
      circular_violation: 'Ierarhia circulară de părinți nu este permisă.'
      section_must_be_root: 'Elementele de tip secțiune trebuie să rămână la nivelul rădăcină (fără părinte).'
    section_collapsible:
      label: 'Copiii secțiunii restrângibili'
      inherit: 'Folosește setarea implicită a meniului'
      yes: 'Da (restrângibil cu săgeată)'
      no: 'Nu (mereu extins)'
      help: 'Suprascrie opțiunea de meniu „Secțiuni restrângibile” doar pentru această secțiune. „Folosește setarea implicită a meniului” urmează configurația meniului.'

  import_menu_type:
    file:
      label: 'Fișier JSON'
      required: 'Vă rugăm să alegeți un fișier.'
      mime_message: 'Fișierul trebuie să fie JSON.'
    strategy:
      label: 'Când există deja un meniu cu același cod și context'
      skip_existing: 'Omite (nu importa)'
      replace: 'Înlocuiește (șterge elementele existente și importă)'

  copy_menu_type:
    code:
      label: 'Cod'
      placeholder: 'ex. sidebar_copy'
      regex_message: 'Codul poate conține doar litere, cifre, liniuță jos și cratimă.'
    name:
      label: 'Nume'
      placeholder: 'ex. Bară laterală (copie)'
