# Form: MenuType
form:
  menu_type:
    code:
      label: 'Kod'
      help: 'Unik identifierare (bokstäver, siffror, _ -). För basmenyer kan koden inte ändras efter att menyn skapats.'
      placeholder: 't.ex. sidebar'
    base:
      label: 'Basmeny'
      help: 'Om markerad kan menyns kod inte ändras efter att den skapats.'
    name:
      label: 'Namn'
      placeholder: 't.ex. Sidofält'
    context:
      label: 'Kontext'
      help: 'Valfria nyckel-värde-par i JSON som identifierar denna menyvariant. Vid uppslag via kod används den första matchande menyn i de ordnade kontextuppsättningarna; tomt = reserv för den koden.'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'Ikon'
      help: 'Valfri ikonidentifierare (t.ex. Symfony UX Icons: heroicons:home, bootstrap:house).'
      placeholder: 't.ex. heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: 'Behörighetskontroll'
      placeholder: '— Tillåt alla —'
      allow_all: '— Tillåt alla —'
      permission_key_aware: '— Efter behörighetsnyckel (struktur) —'
      help: 'Tjänst som implementerar MenuPermissionCheckerInterface (tomt = tillåt alla).'
    depth_limit:
      label: 'Djupgräns'
      placeholder: 'tomt = obegränsat'
      help: 'Maximalt djup som renderas (1 = endast rot, 2 = rot + en nivå; tomt = obegränsat).'
    collapsible:
      label: 'Hopfällbar (omslut menyn i ett växlingsblock)'
    collapsible_expanded:
      label: 'Hopfällbar, utfälld (öppen som standard)'
    nested_collapsible:
      label: 'Nästlat hopfällbar (objekt med underobjekt har en växlare)'
    nested_collapsible_sections:
      label: 'Hopfällbara sektioner'
      help: 'Kräver nästlat hopfällbar. När aktiverat visar sektionsrader en vinkelpil till höger och deras länkar kan fällas ihop. När inaktiverat förblir sektionernas underobjekt alltid utfällda (ingen vinkelpil).'
    class_menu:
      label: 'Menyklass (rot-<ul>)'
      placeholder: 't.ex. nav flex-column'
    ul_id:
      label: 'Ul-id (rot-<ul>)'
      placeholder: 't.ex. main-menu-navigation'
    class_item:
      label: 'Objektklass (<li>)'
      placeholder: 't.ex. nav-item'
    class_link:
      label: 'Länkklass (<a>)'
      placeholder: 't.ex. nav-link'
    class_children:
      label: 'Klass för underobjekt (nästlad <ul>)'
      placeholder: 't.ex. nav flex-column ms-2'
    class_section_children:
      label: 'Klass för sektionens underobjekt (<ul> under itemType "section")'
      placeholder: 't.ex. nav flex-column list-unstyled ps-0 (platt; tomt = samma som underobjekt)'
      help: 'Om angiven använder listan på första nivån under varje sektion dessa klasser i stället för ”Klass för underobjekt”, så att länkarna kan linjera med sektionsrubriken (utan indrag). Lämna tomt för att fortsätta använda klassen för nästlade underobjekt.'
    class_section_child_item:
      label: '<li>-klass för direkta underobjekt till itemType "section"'
      placeholder: 't.ex. nav-item ms-0 (tomt = samma som Objektklass)'
      help: 'Om angiven använder länkar och avdelare som är direkta underobjekt till en sektion detta som <li>-klass i stället för ”Objektklass”. Används för justering av marginal/utfyllnad i platta sektionslistor.'
    class_section_child_link:
      label: '<a>-klass för direkta underobjekt till itemType "section"'
      placeholder: 't.ex. d-flex align-items-center ps-0 (tomt = samma som Länkklass)'
      help: 'Om angiven använder länkar som är direkta underobjekt till en sektion detta som <a>-klass i stället för ”Länkklass”. Kombineras med sektionsunderobjektets <li> för linjering.'
    class_section_label:
      label: 'Klass för sektionsetikett (itemType "section")'
      placeholder: 't.ex. navigation-header'
    class_section:
      label: 'Sektionsklass (<li> när itemType "section")'
      placeholder: 't.ex. menu-section'
    class_divider:
      label: 'Avdelarklass (<li> när itemType "divider")'
      placeholder: 't.ex. menu-divider'
    class_current:
      label: 'Klass för aktuell (länk som matchar aktuell rutt)'
      placeholder: 't.ex. active'
    class_branch_expanded:
      label: 'Klass för utfälld gren (<li> när rutten finns i grenen)'
      placeholder: 't.ex. active-branch'
    class_has_children:
      label: 'Klass för har underobjekt (<li> när objektet har underobjekt)'
      placeholder: 't.ex. has-children'
    class_expanded:
      label: 'Klass för utfälld (<li> när underobjektsblocket är öppet)'
      placeholder: 't.ex. is-expanded'
    class_collapsed:
      label: 'Klass för hopfälld (<li> när underobjektsblocket är stängt)'
      placeholder: 't.ex. is-collapsed'
    empty_choice: '— Tomt —'
    css_section_heading: 'CSS-klasser för rendering (åsidosätter konfigurationen när de anges).'
    section_definition: 'Definition (kod, bas, namn, kontext, ikon)'
    section_config: 'Konfiguration (behörigheter, djup, hopfällbar, CSS)'

  menu_item_type:
    section_basic: 'Identitet (etiketter)'
    section_icon: 'Identitet (typ, position, ikon)'
    section_config: 'Konfiguration (länk, behörighet)'
    label_required: 'Etikett krävs för Länk och Sektion.'
    label:
      label: 'Etikett'
    label_locale: 'Etikett (%locale%)'
    divider_label_hint: 'Valfritt namn på avdelaren (rekommenderas för tillgänglighet och listan i panelen). Lämna tomt om du bara behöver en visuell avgränsare.'
    type:
      label: 'Typ'
      link: 'Länk'
      section: 'Sektion'
      divider: 'Avdelare'
      service: 'Tjänst (URL vid körning)'
    link_resolver:
      label: 'Länkresolver'
      placeholder: '— Välj resolver —'
      help: 'Välj en tjänst som implementerar MenuLinkResolverInterface. Den kan returnera en enskild URL eller en lista med underliggande länkrader (etikett, href, position); det överordnade objektets href blir då "#".'
      service_id_placeholder: 't.ex. App\Menu\MyLinkResolver'
      help_free_text: 'Ange tjänste-id (klassnamn eller container-id) som implementerar MenuLinkResolverInterface.'
      required: 'En länkresolver krävs för objekttypen ”Tjänst”.'
      route_params_hint: 'Valfri JSON som skickas till resolvern (till exempel ruttliknande parametrar).'
    position:
      label: 'Position'
    link_type:
      label: 'Länktyp'
      route: 'Rutt'
      external_url: 'Extern URL'
    route_name:
      label: 'Ruttnamn'
      placeholder: '— Välj rutt —'
    route_params:
      label: 'Ruttparametrar (JSON)'
      placeholder: '{}'
    external_url:
      label: 'Extern URL'
      placeholder: 'https://...'
    target_blank:
      label: 'Öppna i ny flik'
    permission_keys:
      label: 'Behörighetsnycklar'
      placeholder: '— Tillåt alla —'
      help_csv: 'Kommaseparerade nycklar (används när inga konfigurerade val finns).'
      choice:
        authenticated: 'Endast inloggade'
        admin: 'Endast administratör'
        path__: 'Sökväg: / (endast startsidan)'
    is_unanimous:
      label: 'Kräv alla valda nycklar'
      help: 'Aktiverad: alla nycklar måste godkännas (AND). Inaktiverad: det räcker att en nyckel godkänns (OR).'
    icon:
      label: 'Ikon'
      placeholder: 'heroicons:home'
    parent:
      label: 'Överordnat objekt'
      placeholder: '— Rot (inget överordnat) —'
      help_inheritance: 'Överordnade objekt ligger ovanför detta i trädet. Behörighetsnycklar på denna rad gäller detta objekt; din MenuPermissionChecker avgör hur regler för överordnade och underordnade objekt kombineras. Sektioner och utfällbara länkar renderas bara när minst ett underobjekt visas.'
      circular_violation: 'Cirkulär hierarki av överordnade objekt är inte tillåten.'
      section_must_be_root: 'Sektioner måste ligga kvar på rotnivån (inget överordnat objekt).'
    section_collapsible:
      label: 'Hopfällbara underobjekt i sektionen'
      inherit: 'Använd menyns standard'
      yes: 'Ja (hopfällbar med vinkelpil)'
      no: 'Nej (alltid utfälld)'
      help: 'Åsidosätter menyalternativet ”Hopfällbara sektioner” endast för denna sektion. ”Använd menyns standard” följer menyns konfiguration.'

  import_menu_type:
    file:
      label: 'JSON-fil'
      required: 'Välj en fil.'
      mime_message: 'Filen måste vara i JSON-format.'
    strategy:
      label: 'När en meny med samma kod och kontext redan finns'
      skip_existing: 'Hoppa över (importera inte)'
      replace: 'Ersätt (ta bort befintliga objekt och importera)'

  copy_menu_type:
    code:
      label: 'Kod'
      placeholder: 't.ex. sidebar_copy'
      regex_message: 'Koden får endast innehålla bokstäver, siffror, understreck och bindestreck.'
    name:
      label: 'Namn'
      placeholder: 't.ex. Sidofält (kopia)'
