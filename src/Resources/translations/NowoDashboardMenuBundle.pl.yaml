# Form: MenuType
form:
  menu_type:
    code:
      label: 'Kod'
      help: 'Unikalny identyfikator (litery, cyfry, _ -). W przypadku menu bazowych kodu nie można zmienić po utworzeniu.'
      placeholder: 'np. sidebar'
    base:
      label: 'Menu bazowe'
      help: 'Po zaznaczeniu kodu tego menu nie będzie można zmienić po utworzeniu.'
    name:
      label: 'Nazwa'
      placeholder: 'np. Pasek boczny'
    context:
      label: 'Kontekst'
      help: 'Opcjonalne pary klucz-wartość w formacie JSON identyfikujące ten wariant menu. Przy wyszukiwaniu po kodzie używane jest pierwsze pasujące menu z uporządkowanych zestawów kontekstów; puste = wariant domyślny dla tego kodu.'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'Ikona'
      help: 'Opcjonalny identyfikator ikony (np. Symfony UX Icons: heroicons:home, bootstrap:house).'
      placeholder: 'np. heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: 'Weryfikator uprawnień'
      placeholder: '— Zezwól wszystkim —'
      allow_all: '— Zezwól wszystkim —'
      permission_key_aware: '— Według klucza uprawnień (struktura) —'
      help: 'Usługa implementująca MenuPermissionCheckerInterface (puste = zezwól wszystkim).'
    depth_limit:
      label: 'Limit głębokości'
      placeholder: 'puste = bez limitu'
      help: 'Maksymalna renderowana głębokość (1 = tylko poziom główny, 2 = poziom główny + jeden poziom; puste = bez limitu).'
    collapsible:
      label: 'Zwijane (otocz menu blokiem przełączania)'
    collapsible_expanded:
      label: 'Zwijane, rozwinięte (domyślnie otwarte)'
    nested_collapsible:
      label: 'Zagnieżdżone zwijane (elementy z elementami podrzędnymi mają przełącznik)'
    nested_collapsible_sections:
      label: 'Zwijane sekcje'
      help: 'Wymaga opcji „Zagnieżdżone zwijane”. Gdy włączone, wiersze sekcji wyświetlają strzałkę po prawej stronie, a ich linki można zwijać. Gdy wyłączone, elementy podrzędne sekcji są zawsze rozwinięte (bez strzałki).'
    class_menu:
      label: 'Klasa menu (główny <ul>)'
      placeholder: 'np. nav flex-column'
    ul_id:
      label: 'Id elementu ul (główny <ul>)'
      placeholder: 'np. main-menu-navigation'
    class_item:
      label: 'Klasa elementu (<li>)'
      placeholder: 'np. nav-item'
    class_link:
      label: 'Klasa linku (<a>)'
      placeholder: 'np. nav-link'
    class_children:
      label: 'Klasa elementów podrzędnych (zagnieżdżony <ul>)'
      placeholder: 'np. nav flex-column ms-2'
    class_section_children:
      label: 'Klasa elementów podrzędnych sekcji (<ul> pod itemType "section")'
      placeholder: 'np. nav flex-column list-unstyled ps-0 (płaska; puste = tak samo jak elementy podrzędne)'
      help: 'Jeśli ustawiono, lista pierwszego poziomu pod każdą sekcją używa tych klas zamiast „Klasy elementów podrzędnych”, dzięki czemu linki mogą być wyrównane z tytułem sekcji (bez wcięcia). Pozostaw puste, aby nadal używać klasy zagnieżdżonych elementów podrzędnych.'
    class_section_child_item:
      label: 'Klasa <li> dla bezpośrednich elementów podrzędnych itemType "section"'
      placeholder: 'np. nav-item ms-0 (puste = tak samo jak Klasa elementu)'
      help: 'Jeśli ustawiono, linki i separatory będące bezpośrednimi elementami podrzędnymi sekcji używają tej klasy dla <li> zamiast „Klasy elementu”. Przydatne do dostosowania marginesów/dopełnienia w płaskich listach sekcji.'
    class_section_child_link:
      label: 'Klasa <a> dla bezpośrednich elementów podrzędnych itemType "section"'
      placeholder: 'np. d-flex align-items-center ps-0 (puste = tak samo jak Klasa linku)'
      help: 'Jeśli ustawiono, linki będące bezpośrednimi elementami podrzędnymi sekcji używają tej klasy dla <a> zamiast „Klasy linku”. Działa w parze z klasą <li> elementów podrzędnych sekcji w celu wyrównania.'
    class_section_label:
      label: 'Klasa etykiety sekcji (itemType "section")'
      placeholder: 'np. navigation-header'
    class_section:
      label: 'Klasa sekcji (<li> gdy itemType "section")'
      placeholder: 'np. menu-section'
    class_divider:
      label: 'Klasa separatora (<li> gdy itemType "divider")'
      placeholder: 'np. menu-divider'
    class_current:
      label: 'Klasa bieżącego (link pasujący do bieżącej trasy)'
      placeholder: 'np. active'
    class_branch_expanded:
      label: 'Klasa rozwiniętej gałęzi (<li> gdy trasa jest w gałęzi)'
      placeholder: 'np. active-branch'
    class_has_children:
      label: 'Klasa „ma elementy podrzędne” (<li> gdy element ma elementy podrzędne)'
      placeholder: 'np. has-children'
    class_expanded:
      label: 'Klasa rozwiniętego (<li> gdy blok elementów podrzędnych jest otwarty)'
      placeholder: 'np. is-expanded'
    class_collapsed:
      label: 'Klasa zwiniętego (<li> gdy blok elementów podrzędnych jest zamknięty)'
      placeholder: 'np. is-collapsed'
    empty_choice: '— Puste —'
    css_section_heading: 'Klasy CSS do renderowania (zastępują konfigurację, jeśli ustawione).'
    section_definition: 'Definicja (kod, bazowe, nazwa, kontekst, ikona)'
    section_config: 'Konfiguracja (uprawnienia, głębokość, zwijanie, CSS)'

  menu_item_type:
    section_basic: 'Tożsamość (etykiety)'
    section_icon: 'Tożsamość (typ, pozycja, ikona)'
    section_config: 'Konfiguracja (link, uprawnienia)'
    label_required: 'Etykieta jest wymagana dla linku i sekcji.'
    label:
      label: 'Etykieta'
    label_locale: 'Etykieta (%locale%)'
    labels_by_locale: 'Etykieta według języka'
    divider_label_hint: 'Opcjonalna nazwa separatora (zalecana ze względu na dostępność i listę w panelu). Pozostaw puste, jeśli potrzebujesz tylko wizualnego separatora.'
    type:
      label: 'Typ'
      link: 'Link'
      section: 'Sekcja'
      divider: 'Separator'
      service: 'Usługa (URL w czasie działania)'
    link_resolver:
      label: 'Resolver linków'
      placeholder: '— Wybierz resolver —'
      help: 'Wybierz usługę implementującą MenuLinkResolverInterface. Może ona zwrócić pojedynczy URL lub listę podrzędnych wierszy linków (etykieta, href, pozycja); wówczas href elementu nadrzędnego to "#".'
      service_id_placeholder: 'np. App\Menu\MyLinkResolver'
      help_free_text: 'Wprowadź identyfikator usługi (nazwę klasy lub id kontenera), która implementuje MenuLinkResolverInterface.'
      required: 'Resolver linków jest wymagany dla typu elementu „Usługa”.'
      route_params_hint: 'Opcjonalny JSON przekazywany do resolvera (np. parametry podobne do parametrów trasy).'
    position:
      label: 'Pozycja'
    link_type:
      label: 'Typ linku'
      route: 'Trasa'
      external_url: 'Zewnętrzny URL'
    route_name:
      label: 'Nazwa trasy'
      placeholder: '— Wybierz trasę —'
    route_params:
      label: 'Parametry trasy (JSON)'
      placeholder: '{}'
    external_url:
      label: 'Zewnętrzny URL'
      placeholder: 'https://...'
    target_blank:
      label: 'Otwórz w nowej karcie'
    permission_keys:
      label: 'Klucze uprawnień'
      placeholder: '— Zezwól wszystkim —'
      help_csv: 'Klucze oddzielone przecinkami (używane, gdy nie są dostępne skonfigurowane opcje).'
      choice:
        authenticated: 'Tylko zalogowani'
        admin: 'Tylko administrator'
        path__: 'Ścieżka: / (tylko strona główna)'
    is_unanimous:
      label: 'Wymagaj wszystkich wybranych kluczy'
      help: 'Włączone: wszystkie klucze muszą zostać spełnione (AND). Wyłączone: wystarczy dowolny klucz (OR).'
    icon:
      label: 'Ikona'
      placeholder: 'heroicons:home'
    parent:
      label: 'Element nadrzędny'
      placeholder: '— Poziom główny (bez elementu nadrzędnego) —'
      help_inheritance: 'Elementy nadrzędne znajdują się w drzewie nad tym elementem. Klucze uprawnień w tym wierszu dotyczą tego elementu; to Twój MenuPermissionChecker decyduje, jak łączone są reguły elementów nadrzędnych i podrzędnych. Sekcje i rozwijane linki są renderowane tylko wtedy, gdy wyświetlany jest co najmniej jeden element podrzędny.'
      circular_violation: 'Cykliczna hierarchia elementów nadrzędnych jest niedozwolona.'
      section_must_be_root: 'Sekcje muszą pozostać na poziomie głównym (bez elementu nadrzędnego).'
    section_collapsible:
      label: 'Zwijane elementy podrzędne sekcji'
      inherit: 'Użyj ustawienia domyślnego menu'
      yes: 'Tak (zwijane ze strzałką)'
      no: 'Nie (zawsze rozwinięte)'
      help: 'Zastępuje opcję menu „Zwijane sekcje” tylko dla tej sekcji. „Użyj ustawienia domyślnego menu” stosuje konfigurację menu.'

  import_menu_type:
    file:
      label: 'Plik JSON'
      required: 'Wybierz plik.'
      mime_message: 'Plik musi być w formacie JSON.'
    strategy:
      label: 'Gdy menu z tym samym kodem i kontekstem już istnieje'
      skip_existing: 'Pomiń (nie importuj)'
      replace: 'Zastąp (usuń istniejące elementy i zaimportuj)'

  copy_menu_type:
    code:
      label: 'Kod'
      placeholder: 'np. sidebar_copy'
      regex_message: 'Kod może zawierać wyłącznie litery, cyfry, podkreślenia i łączniki.'
    name:
      label: 'Nazwa'
      placeholder: 'np. Pasek boczny (kopia)'
