# Form: MenuType
form:
  menu_type:
    code:
      label: 'Kode'
      help: 'Pengenal unik (huruf, angka, _ -). Untuk menu dasar, kode tidak dapat diubah setelah dibuat.'
      placeholder: 'mis. sidebar'
    base:
      label: 'Menu dasar'
      help: 'Jika dicentang, kode menu ini tidak dapat diubah setelah dibuat.'
    name:
      label: 'Nama'
      placeholder: 'mis. Bilah samping'
    context:
      label: 'Konteks'
      help: 'Pasangan kunci-nilai JSON opsional untuk mengidentifikasi varian menu ini. Saat menyelesaikan berdasarkan kode, menu pertama yang cocok dalam urutan set konteks akan digunakan; kosong = cadangan untuk kode tersebut.'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'Ikon'
      help: 'Pengenal ikon opsional (mis. Symfony UX Icons: heroicons:home, bootstrap:house).'
      placeholder: 'mis. heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: 'Pemeriksa izin'
      placeholder: '— Izinkan semua —'
      allow_all: '— Izinkan semua —'
      permission_key_aware: '— Berdasarkan kunci izin (struktur) —'
      help: 'Layanan yang mengimplementasikan MenuPermissionCheckerInterface (kosong = izinkan semua).'
    depth_limit:
      label: 'Batas kedalaman'
      placeholder: 'kosong = tanpa batas'
      help: 'Kedalaman maksimum yang dirender (1 = hanya akar, 2 = akar + satu tingkat; kosong = tanpa batas).'
    collapsible:
      label: 'Dapat diciutkan (bungkus menu dalam blok buka/tutup)'
    collapsible_expanded:
      label: 'Dapat diciutkan, terbuka (terbuka secara default)'
    nested_collapsible:
      label: 'Ciutkan bertingkat (item yang memiliki turunan punya tombol buka/tutup)'
    nested_collapsible_sections:
      label: 'Bagian dapat diciutkan'
      help: 'Memerlukan ciutkan bertingkat. Jika diaktifkan, baris bagian menampilkan panah di sebelah kanan dan tautannya dapat dilipat. Jika dinonaktifkan, turunan bagian selalu terbuka (tanpa panah).'
    class_menu:
      label: 'Kelas menu (<ul> akar)'
      placeholder: 'mis. nav flex-column'
    ul_id:
      label: 'Id ul (<ul> akar)'
      placeholder: 'mis. main-menu-navigation'
    class_item:
      label: 'Kelas item (<li>)'
      placeholder: 'mis. nav-item'
    class_link:
      label: 'Kelas tautan (<a>)'
      placeholder: 'mis. nav-link'
    class_children:
      label: 'Kelas turunan (<ul> bertingkat)'
      placeholder: 'mis. nav flex-column ms-2'
    class_section_children:
      label: 'Kelas turunan bagian (<ul> di bawah itemType "section")'
      placeholder: 'mis. nav flex-column list-unstyled ps-0 (datar; kosong = sama dengan turunan)'
      help: 'Jika diisi, daftar tingkat pertama di bawah setiap bagian menggunakan kelas ini alih-alih “Kelas turunan”, sehingga tautan dapat sejajar dengan judul bagian (tanpa indentasi). Biarkan kosong untuk tetap menggunakan kelas turunan bertingkat.'
    class_section_child_item:
      label: 'Kelas <li> untuk turunan langsung itemType "section"'
      placeholder: 'mis. nav-item ms-0 (kosong = sama dengan Kelas item)'
      help: 'Jika diisi, tautan dan pemisah yang merupakan turunan langsung dari sebuah bagian menggunakan nilai ini untuk kelas <li> alih-alih “Kelas item”. Gunakan untuk penyesuaian margin/padding di bawah daftar bagian datar.'
    class_section_child_link:
      label: 'Kelas <a> untuk turunan langsung itemType "section"'
      placeholder: 'mis. d-flex align-items-center ps-0 (kosong = sama dengan Kelas tautan)'
      help: 'Jika diisi, tautan yang merupakan turunan langsung dari sebuah bagian menggunakan nilai ini untuk kelas <a> alih-alih “Kelas tautan”. Dipasangkan dengan <li> turunan bagian untuk perataan.'
    class_section_label:
      label: 'Kelas label bagian (itemType "section")'
      placeholder: 'mis. navigation-header'
    class_section:
      label: 'Kelas bagian (<li> jika itemType "section")'
      placeholder: 'mis. menu-section'
    class_divider:
      label: 'Kelas pemisah (<li> jika itemType "divider")'
      placeholder: 'mis. menu-divider'
    class_current:
      label: 'Kelas aktif (tautan yang cocok dengan rute saat ini)'
      placeholder: 'mis. active'
    class_branch_expanded:
      label: 'Kelas cabang terbuka (<li> jika rute berada di cabang)'
      placeholder: 'mis. active-branch'
    class_has_children:
      label: 'Kelas memiliki turunan (<li> jika item memiliki turunan)'
      placeholder: 'mis. has-children'
    class_expanded:
      label: 'Kelas terbuka (<li> jika blok turunan terbuka)'
      placeholder: 'mis. is-expanded'
    class_collapsed:
      label: 'Kelas tertutup (<li> jika blok turunan tertutup)'
      placeholder: 'mis. is-collapsed'
    empty_choice: '— Kosong —'
    css_section_heading: 'Kelas CSS untuk rendering (menimpa konfigurasi jika diisi).'
    section_definition: 'Definisi (kode, dasar, nama, konteks, ikon)'
    section_config: 'Konfigurasi (izin, kedalaman, dapat diciutkan, CSS)'

  menu_item_type:
    section_basic: 'Identitas (label)'
    section_icon: 'Identitas (jenis, posisi, ikon)'
    section_config: 'Konfigurasi (tautan, izin)'
    label_required: 'Label wajib diisi untuk Tautan dan Bagian.'
    label:
      label: 'Label'
    label_locale: 'Label (%locale%)'
    labels_by_locale: 'Label per bahasa'
    divider_label_hint: 'Nama opsional untuk pemisah ini (disarankan untuk aksesibilitas dan daftar di dasbor). Biarkan kosong jika Anda hanya memerlukan pemisah visual.'
    type:
      label: 'Jenis'
      link: 'Tautan'
      section: 'Bagian'
      divider: 'Pemisah'
      service: 'Layanan (URL saat runtime)'
    link_resolver:
      label: 'Penyelesai tautan'
      placeholder: '— Pilih penyelesai —'
      help: 'Pilih layanan yang mengimplementasikan MenuLinkResolverInterface. Layanan ini dapat mengembalikan satu URL atau daftar baris tautan turunan (label, href, posisi); href induk kemudian menjadi "#".'
      service_id_placeholder: 'mis. App\Menu\MyLinkResolver'
      help_free_text: 'Masukkan id layanan (nama kelas atau id kontainer) yang mengimplementasikan MenuLinkResolverInterface.'
      required: 'Penyelesai tautan wajib diisi untuk jenis item “Layanan”.'
      route_params_hint: 'JSON opsional yang diteruskan ke penyelesai (misalnya parameter mirip rute).'
    position:
      label: 'Posisi'
    link_type:
      label: 'Jenis tautan'
      route: 'Rute'
      external_url: 'URL eksternal'
    route_name:
      label: 'Nama rute'
      placeholder: '— Pilih rute —'
    route_params:
      label: 'Parameter rute (JSON)'
      placeholder: '{}'
    external_url:
      label: 'URL eksternal'
      placeholder: 'https://...'
    target_blank:
      label: 'Buka di tab baru'
    permission_keys:
      label: 'Kunci izin'
      placeholder: '— Izinkan semua —'
      help_csv: 'Kunci dipisahkan koma (digunakan jika tidak ada pilihan yang dikonfigurasi).'
      choice:
        authenticated: 'Hanya pengguna terautentikasi'
        admin: 'Hanya admin'
        path__: 'Jalur: / (hanya beranda)'
    is_unanimous:
      label: 'Wajibkan semua kunci yang dipilih'
      help: 'Aktif: semua kunci harus lolos (AND). Nonaktif: cukup satu kunci yang lolos (OR).'
    icon:
      label: 'Ikon'
      placeholder: 'heroicons:home'
    parent:
      label: 'Induk'
      placeholder: '— Akar (tanpa induk) —'
      help_inheritance: 'Item induk berada di atas item ini dalam pohon. Kunci izin pada baris ini berlaku untuk item ini; MenuPermissionChecker Anda menentukan bagaimana aturan induk/turunan digabungkan. Bagian dan tautan yang dapat dibuka hanya dirender jika setidaknya satu turunan ditampilkan.'
      circular_violation: 'Hierarki induk melingkar tidak diizinkan.'
      section_must_be_root: 'Item bagian harus tetap berada di tingkat akar (tanpa induk).'
    section_collapsible:
      label: 'Turunan bagian dapat diciutkan'
      inherit: 'Gunakan default menu'
      yes: 'Ya (dapat diciutkan dengan panah)'
      no: 'Tidak (selalu terbuka)'
      help: 'Menimpa opsi menu “Bagian dapat diciutkan” hanya untuk bagian ini. “Gunakan default menu” mengikuti konfigurasi menu.'

  import_menu_type:
    file:
      label: 'File JSON'
      required: 'Silakan pilih file.'
      mime_message: 'File harus berformat JSON.'
    strategy:
      label: 'Jika menu dengan kode dan konteks yang sama sudah ada'
      skip_existing: 'Lewati (jangan impor)'
      replace: 'Ganti (hapus item yang ada lalu impor)'

  copy_menu_type:
    code:
      label: 'Kode'
      placeholder: 'mis. sidebar_copy'
      regex_message: 'Kode hanya boleh berisi huruf, angka, garis bawah, dan tanda hubung.'
    name:
      label: 'Nama'
      placeholder: 'mis. Bilah samping (salinan)'
