# Form: MenuType
form:
  menu_type:
    code:
      label: 'Mã'
      help: 'Định danh duy nhất (chữ cái, chữ số, _ -). Với menu cơ sở, không thể thay đổi mã sau khi tạo.'
      placeholder: 'vd. sidebar'
    base:
      label: 'Menu cơ sở'
      help: 'Khi được chọn, mã của menu này không thể thay đổi sau khi tạo.'
    name:
      label: 'Tên'
      placeholder: 'vd. Thanh bên'
    context:
      label: 'Ngữ cảnh'
      help: 'Các cặp khóa-giá trị JSON tùy chọn để nhận diện biến thể menu này. Khi phân giải theo mã, menu khớp đầu tiên trong các tập ngữ cảnh đã sắp xếp sẽ được dùng; để trống = menu dự phòng cho mã đó.'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'Biểu tượng'
      help: 'Định danh biểu tượng tùy chọn (vd. Symfony UX Icons: heroicons:home, bootstrap:house).'
      placeholder: 'vd. heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: 'Bộ kiểm tra quyền'
      placeholder: '— Cho phép tất cả —'
      allow_all: '— Cho phép tất cả —'
      permission_key_aware: '— Theo khóa quyền (cấu trúc) —'
      help: 'Service triển khai MenuPermissionCheckerInterface (để trống = cho phép tất cả).'
    depth_limit:
      label: 'Giới hạn độ sâu'
      placeholder: 'để trống = không giới hạn'
      help: 'Độ sâu tối đa để hiển thị (1 = chỉ cấp gốc, 2 = cấp gốc + một cấp; để trống = không giới hạn).'
    collapsible:
      label: 'Có thể thu gọn (bọc menu trong khối bật/tắt)'
    collapsible_expanded:
      label: 'Có thể thu gọn, mở sẵn (mở theo mặc định)'
    nested_collapsible:
      label: 'Thu gọn lồng nhau (mục có mục con có nút bật/tắt)'
    nested_collapsible_sections:
      label: 'Mục phân nhóm có thể thu gọn'
      help: 'Yêu cầu bật thu gọn lồng nhau. Khi bật, các hàng phân nhóm hiển thị mũi tên ở bên phải và các liên kết của chúng có thể được thu gọn. Khi tắt, các mục con của phân nhóm luôn mở rộng (không có mũi tên).'
    class_menu:
      label: 'Lớp menu (<ul> gốc)'
      placeholder: 'vd. nav flex-column'
    ul_id:
      label: 'Id của ul (<ul> gốc)'
      placeholder: 'vd. main-menu-navigation'
    class_item:
      label: 'Lớp mục (<li>)'
      placeholder: 'vd. nav-item'
    class_link:
      label: 'Lớp liên kết (<a>)'
      placeholder: 'vd. nav-link'
    class_children:
      label: 'Lớp mục con (<ul> lồng nhau)'
      placeholder: 'vd. nav flex-column ms-2'
    class_section_children:
      label: 'Lớp mục con của phân nhóm (<ul> dưới itemType "section")'
      placeholder: 'vd. nav flex-column list-unstyled ps-0 (phẳng; để trống = giống lớp mục con)'
      help: 'Khi được đặt, danh sách cấp đầu tiên dưới mỗi phân nhóm sẽ dùng các lớp này thay cho “Lớp mục con”, để các liên kết có thể căn thẳng với tiêu đề phân nhóm (không thụt lề). Để trống để tiếp tục dùng lớp mục con lồng nhau.'
    class_section_child_item:
      label: 'Lớp <li> cho mục con trực tiếp của itemType "section"'
      placeholder: 'vd. nav-item ms-0 (để trống = giống Lớp mục)'
      help: 'Khi được đặt, các liên kết và mục phân cách là con trực tiếp của một phân nhóm sẽ dùng giá trị này làm lớp <li> thay cho “Lớp mục”. Dùng để tinh chỉnh margin/padding trong danh sách phân nhóm phẳng.'
    class_section_child_link:
      label: 'Lớp <a> cho mục con trực tiếp của itemType "section"'
      placeholder: 'vd. d-flex align-items-center ps-0 (để trống = giống Lớp liên kết)'
      help: 'Khi được đặt, các liên kết là con trực tiếp của một phân nhóm sẽ dùng giá trị này làm lớp <a> thay cho “Lớp liên kết”. Kết hợp với lớp <li> của mục con phân nhóm để căn chỉnh.'
    class_section_label:
      label: 'Lớp nhãn phân nhóm (itemType "section")'
      placeholder: 'vd. navigation-header'
    class_section:
      label: 'Lớp phân nhóm (<li> khi itemType "section")'
      placeholder: 'vd. menu-section'
    class_divider:
      label: 'Lớp phân cách (<li> khi itemType "divider")'
      placeholder: 'vd. menu-divider'
    class_current:
      label: 'Lớp hiện tại (liên kết khớp với tuyến hiện tại)'
      placeholder: 'vd. active'
    class_branch_expanded:
      label: 'Lớp nhánh mở rộng (<li> khi tuyến nằm trong nhánh)'
      placeholder: 'vd. active-branch'
    class_has_children:
      label: 'Lớp có mục con (<li> khi mục có mục con)'
      placeholder: 'vd. has-children'
    class_expanded:
      label: 'Lớp mở rộng (<li> khi khối mục con đang mở)'
      placeholder: 'vd. is-expanded'
    class_collapsed:
      label: 'Lớp thu gọn (<li> khi khối mục con đang đóng)'
      placeholder: 'vd. is-collapsed'
    empty_choice: '— Trống —'
    css_section_heading: 'Các lớp CSS dùng để hiển thị (ghi đè cấu hình khi được đặt).'
    section_definition: 'Định nghĩa (mã, cơ sở, tên, ngữ cảnh, biểu tượng)'
    section_config: 'Cấu hình (quyền, độ sâu, thu gọn, CSS)'

