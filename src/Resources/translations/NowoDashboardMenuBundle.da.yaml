# Form: MenuType
form:
  menu_type:
    code:
      label: 'Kode'
      help: 'Unik identifikator (bogstaver, tal, _ -). For basismenuer kan koden ikke ændres efter oprettelse.'
      placeholder: 'f.eks. sidebar'
    base:
      label: 'Basismenu'
      help: 'Når markeret, kan denne menus kode ikke ændres efter oprettelse.'
    name:
      label: 'Navn'
      placeholder: 'f.eks. Sidepanel'
    context:
      label: 'Kontekst'
      help: 'Valgfrie JSON-nøgle-værdi-par til at identificere denne menuvariant. Ved opslag efter kode bruges den første matchende menu i de ordnede kontekstsæt; tom = standard for den kode.'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'Ikon'
      help: 'Valgfri ikon-identifikator (f.eks. Symfony UX Icons: heroicons:home, bootstrap:house).'
      placeholder: 'f.eks. heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: 'Tilladelseskontrol'
      placeholder: '— Tillad alle —'
      allow_all: '— Tillad alle —'
      permission_key_aware: '— Efter tilladelsesnøgle (struktur) —'
      help: 'Tjeneste, der implementerer MenuPermissionCheckerInterface (tom = tillad alle).'
    depth_limit:
      label: 'Dybdegrænse'
      placeholder: 'tom = ubegrænset'
      help: 'Maksimal dybde der vises (1 = kun rod, 2 = rod + ét niveau; tom = ubegrænset).'
    collapsible:
      label: 'Sammenklappelig (indpak menuen i en blok, der kan vises/skjules)'
    collapsible_expanded:
      label: 'Sammenklappelig udvidet (åben som standard)'
    nested_collapsible:
      label: 'Indlejret sammenklappelig (elementer med underelementer har en knap til at vise/skjule)'
    nested_collapsible_sections:
      label: 'Sammenklappelige sektioner'
      help: 'Kræver indlejret sammenklappelig. Når aktiveret, viser sektionsrækker en pil til højre, og deres links kan klappes sammen. Når deaktiveret, forbliver sektionens underelementer altid udvidede (ingen pil).'
    class_menu:
      label: 'Menuklasse (rod-<ul>)'
      placeholder: 'f.eks. nav flex-column'
    ul_id:
      label: 'Ul-id (rod-<ul>)'
      placeholder: 'f.eks. main-menu-navigation'
    class_item:
      label: 'Elementklasse (<li>)'
      placeholder: 'f.eks. nav-item'
    class_link:
      label: 'Linkklasse (<a>)'
      placeholder: 'f.eks. nav-link'
    class_children:
      label: 'Underelementklasse (indlejret <ul>)'
      placeholder: 'f.eks. nav flex-column ms-2'
    class_section_children:
      label: 'Klasse for sektionens underelementer (<ul> under itemType "section")'
      placeholder: 'f.eks. nav flex-column list-unstyled ps-0 (flad; tom = samme som underelementer)'
      help: 'Når angivet, bruger listen på første niveau under hver sektion disse klasser i stedet for „Underelementklasse“, så links kan flugte med sektionstitlen (uden indrykning). Lad feltet være tomt for fortsat at bruge klassen for indlejrede underelementer.'
    class_section_child_item:
      label: '<li>-klasse for direkte underelementer af itemType "section"'
      placeholder: 'f.eks. nav-item ms-0 (tom = samme som Elementklasse)'
      help: 'Når angivet, bruger links og skillelinjer, der er direkte underelementer af en sektion, denne værdi som <li>-klasse i stedet for „Elementklasse“. Bruges til justering af margin/padding under flade sektionslister.'
    class_section_child_link:
      label: '<a>-klasse for direkte underelementer af itemType "section"'
      placeholder: 'f.eks. d-flex align-items-center ps-0 (tom = samme som Linkklasse)'
      help: 'Når angivet, bruger links, der er direkte underelementer af en sektion, denne værdi som <a>-klasse i stedet for „Linkklasse“. Kombineres med sektionens underelement-<li> for justering.'
    class_section_label:
      label: 'Klasse for sektionsetiket (itemType "section")'
      placeholder: 'f.eks. navigation-header'
    class_section:
      label: 'Sektionsklasse (<li> når itemType er "section")'
      placeholder: 'f.eks. menu-section'
    class_divider:
      label: 'Skillelinjeklasse (<li> når itemType er "divider")'
      placeholder: 'f.eks. menu-divider'
    class_current:
      label: 'Klasse for aktuel (link, der matcher den aktuelle rute)'
      placeholder: 'f.eks. active'
    class_branch_expanded:
      label: 'Klasse for udvidet gren (<li> når ruten er i grenen)'
      placeholder: 'f.eks. active-branch'
    class_has_children:
      label: 'Klasse for har underelementer (<li> når elementet har underelementer)'
      placeholder: 'f.eks. has-children'
    class_expanded:
      label: 'Klasse for udvidet (<li> når underelementblokken er åben)'
      placeholder: 'f.eks. is-expanded'
    class_collapsed:
      label: 'Klasse for sammenklappet (<li> når underelementblokken er lukket)'
      placeholder: 'f.eks. is-collapsed'
    empty_choice: '— Tom —'
    css_section_heading: 'CSS-klasser til visning (tilsidesætter konfigurationen, når de er angivet).'
    section_definition: 'Definition (kode, basis, navn, kontekst, ikon)'
    section_config: 'Konfiguration (tilladelser, dybde, sammenklappelig, CSS)'

  menu_item_type:
    section_basic: 'Identitet (etiketter)'
    section_icon: 'Identitet (type, position, ikon)'
    section_config: 'Konfiguration (link, tilladelse)'
    label_required: 'Etiket er påkrævet for Link og Sektion.'
    label:
      label: 'Etiket'
    label_locale: 'Etiket (%locale%)'
    divider_label_hint: 'Valgfrit navn til denne skillelinje (anbefales af hensyn til tilgængelighed og listen i administrationen). Lad feltet være tomt, hvis du kun har brug for en visuel adskillelse.'
    type:
      label: 'Type'
      link: 'Link'
      section: 'Sektion'
      divider: 'Skillelinje'
      service: 'Tjeneste (URL ved kørsel)'
    link_resolver:
      label: 'Link-resolver'
      placeholder: '— Vælg resolver —'
      help: 'Vælg en tjeneste, der implementerer MenuLinkResolverInterface. Den kan returnere en enkelt URL eller en liste af underordnede linkrækker (etiket, href, position); det overordnede href er så "#".'
      service_id_placeholder: 'f.eks. App\Menu\MyLinkResolver'
      help_free_text: 'Angiv tjeneste-id''et (klassenavn eller container-id), der implementerer MenuLinkResolverInterface.'
      required: 'En link-resolver er påkrævet for elementtypen „Tjeneste“.'
      route_params_hint: 'Valgfri JSON, der sendes til resolveren (f.eks. rutelignende parametre).'
    position:
      label: 'Position'
    link_type:
      label: 'Linktype'
      route: 'Rute'
      external_url: 'Ekstern URL'
    route_name:
      label: 'Rutenavn'
      placeholder: '— Vælg rute —'
    route_params:
      label: 'Ruteparametre (JSON)'
      placeholder: '{}'
    external_url:
      label: 'Ekstern URL'
      placeholder: 'https://...'
    target_blank:
      label: 'Åbn i ny fane'
    permission_keys:
      label: 'Tilladelsesnøgler'
      placeholder: '— Tillad alle —'
      help_csv: 'Kommaseparerede nøgler (bruges, når der ikke er konfigurerede valgmuligheder).'
      choice:
        authenticated: 'Kun godkendte brugere'
        admin: 'Kun administratorer'
        path__: 'Sti: / (kun forside)'
    is_unanimous:
      label: 'Kræv alle valgte nøgler'
      help: 'Aktiveret: alle nøgler skal opfyldes (AND). Deaktiveret: én nøgle er nok (OR).'
    icon:
      label: 'Ikon'
      placeholder: 'heroicons:home'
    parent:
      label: 'Overordnet'
      placeholder: '— Rod (intet overordnet) —'
      help_inheritance: 'Overordnede elementer ligger over dette i træet. Tilladelsesnøgler i denne række gælder for dette element; din MenuPermissionChecker afgør, hvordan regler for overordnede og underordnede elementer kombineres. Sektioner og udvidelige links vises kun, når mindst ét underelement vises.'
      circular_violation: 'Cirkulært hierarki af overordnede elementer er ikke tilladt.'
      section_must_be_root: 'Sektionselementer skal forblive på rodniveau (intet overordnet).'
    section_collapsible:
      label: 'Sektionens underelementer sammenklappelige'
      inherit: 'Brug menuens standard'
      yes: 'Ja (sammenklappelig med pil)'
      no: 'Nej (altid udvidet)'
      help: 'Tilsidesætter menuindstillingen „Sammenklappelige sektioner“ kun for denne sektion. „Brug menuens standard“ følger menuens konfiguration.'

  import_menu_type:
    file:
      label: 'JSON-fil'
      required: 'Vælg en fil.'
      mime_message: 'Filen skal være JSON.'
    strategy:
      label: 'Når en menu med samme kode og kontekst allerede findes'
      skip_existing: 'Spring over (importér ikke)'
      replace: 'Erstat (slet eksisterende elementer og importér)'

  copy_menu_type:
    code:
      label: 'Kode'
      placeholder: 'f.eks. sidebar_copy'
      regex_message: 'Koden må kun indeholde bogstaver, tal, understregning og bindestreg.'
    name:
      label: 'Navn'
      placeholder: 'f.eks. Sidepanel (kopi)'
