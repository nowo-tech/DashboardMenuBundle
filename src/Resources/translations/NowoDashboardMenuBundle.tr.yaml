# Form: MenuType
form:
  menu_type:
    code:
      label: 'Kod'
      help: 'Benzersiz tanımlayıcı (harfler, rakamlar, _ -). Temel menülerde kod, oluşturulduktan sonra değiştirilemez.'
      placeholder: 'ör. sidebar'
    base:
      label: 'Temel menü'
      help: 'İşaretlendiğinde bu menünün kodu, oluşturulduktan sonra değiştirilemez.'
    name:
      label: 'Ad'
      placeholder: 'ör. Kenar çubuğu'
    context:
      label: 'Bağlam'
      help: 'Bu menü varyantını tanımlamak için isteğe bağlı JSON anahtar-değer çiftleri. Koda göre çözümlenirken sıralı bağlam kümelerinde eşleşen ilk menü kullanılır; boş = o kod için yedek.'
      placeholder: '{"partnerId": 1, "operatorId": 1}'
    icon:
      label: 'Simge'
      help: 'İsteğe bağlı simge tanımlayıcısı (ör. Symfony UX Icons: heroicons:home, bootstrap:house).'
      placeholder: 'ör. heroicons:bars-3, bootstrap:list'
    permission_checker:
      label: 'İzin denetleyicisi'
      placeholder: '— Tümüne izin ver —'
      allow_all: '— Tümüne izin ver —'
      permission_key_aware: '— İzin anahtarına göre (yapı) —'
      help: 'MenuPermissionCheckerInterface arayüzünü uygulayan servis (boş = tümüne izin ver).'
    depth_limit:
      label: 'Derinlik sınırı'
      placeholder: 'boş = sınırsız'
      help: 'İşlenecek en fazla derinlik (1 = yalnızca kök, 2 = kök + bir düzey; boş = sınırsız).'
    collapsible:
      label: 'Daraltılabilir (menüyü aç/kapat bloğuna sar)'
    collapsible_expanded:
      label: 'Daraltılabilir, genişletilmiş (varsayılan olarak açık)'
    nested_collapsible:
      label: 'İç içe daraltılabilir (alt öğesi olan öğelerde aç/kapat bulunur)'
    nested_collapsible_sections:
      label: 'Daraltılabilir bölümler'
      help: 'İç içe daraltılabilir seçeneğini gerektirir. Etkinleştirildiğinde bölüm satırlarının sağında bir ok gösterilir ve bağlantıları daraltılabilir. Devre dışı bırakıldığında bölümlerin alt öğeleri her zaman genişletilmiş kalır (ok yok).'
    class_menu:
      label: 'Menü sınıfı (kök <ul>)'
      placeholder: 'ör. nav flex-column'
    ul_id:
      label: 'Ul kimliği (kök <ul>)'
      placeholder: 'ör. main-menu-navigation'
    class_item:
      label: 'Öğe sınıfı (<li>)'
      placeholder: 'ör. nav-item'
    class_link:
      label: 'Bağlantı sınıfı (<a>)'
      placeholder: 'ör. nav-link'
    class_children:
      label: 'Alt öğeler sınıfı (iç içe <ul>)'
      placeholder: 'ör. nav flex-column ms-2'
    class_section_children:
      label: 'Bölüm alt öğeleri sınıfı (itemType "section" altındaki <ul>)'
      placeholder: 'ör. nav flex-column list-unstyled ps-0 (düz; boş = alt öğelerle aynı)'
      help: 'Ayarlandığında, her bölümün altındaki birinci düzey liste “Alt öğeler sınıfı” yerine bu sınıfları kullanır; böylece bağlantılar bölüm başlığıyla hizalanabilir (girinti olmadan). İç içe alt öğeler sınıfını kullanmaya devam etmek için boş bırakın.'
    class_section_child_item:
      label: 'itemType "section" doğrudan alt öğeleri için <li> sınıfı'
      placeholder: 'ör. nav-item ms-0 (boş = Öğe sınıfı ile aynı)'
      help: 'Ayarlandığında, bir bölümün doğrudan alt öğesi olan bağlantılar ve ayırıcılar <li> sınıfı olarak “Öğe sınıfı” yerine bunu kullanır. Düz bölüm listelerinde kenar boşluğu/dolgu ayarları için kullanın.'
    class_section_child_link:
      label: 'itemType "section" doğrudan alt öğeleri için <a> sınıfı'
      placeholder: 'ör. d-flex align-items-center ps-0 (boş = Bağlantı sınıfı ile aynı)'
      help: 'Ayarlandığında, bir bölümün doğrudan alt öğesi olan bağlantılar <a> sınıfı olarak “Bağlantı sınıfı” yerine bunu kullanır. Hizalama için bölüm alt öğesi <li> ile birlikte kullanılır.'
    class_section_label:
      label: 'Bölüm etiketi sınıfı (itemType "section")'
      placeholder: 'ör. navigation-header'
    class_section:
      label: 'Bölüm sınıfı (itemType "section" olduğunda <li>)'
      placeholder: 'ör. menu-section'
    class_divider:
      label: 'Ayırıcı sınıfı (itemType "divider" olduğunda <li>)'
      placeholder: 'ör. menu-divider'
    class_current:
      label: 'Geçerli sınıfı (geçerli rotayla eşleşen bağlantı)'
      placeholder: 'ör. active'
    class_branch_expanded:
      label: 'Genişletilmiş dal sınıfı (rota daldayken <li>)'
      placeholder: 'ör. active-branch'
    class_has_children:
      label: 'Alt öğesi var sınıfı (öğenin alt öğeleri olduğunda <li>)'
      placeholder: 'ör. has-children'
    class_expanded:
      label: 'Genişletilmiş sınıfı (alt öğe bloğu açıkken <li>)'
      placeholder: 'ör. is-expanded'
    class_collapsed:
      label: 'Daraltılmış sınıfı (alt öğe bloğu kapalıyken <li>)'
      placeholder: 'ör. is-collapsed'
